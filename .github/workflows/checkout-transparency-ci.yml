name: Checkout transparency & mobile layout
on:
  push:
    branches: [fix/paid-beta-readiness-notice-20261101, main]
    paths:
      - 'index.html'
      - 'premium-preview/app.js'
      - 'tools/test_mobile_flows.py'
      - '.github/workflows/checkout-transparency-ci.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'premium-preview/app.js'
      - 'tools/test_mobile_flows.py'
      - '.github/workflows/checkout-transparency-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-journey:
    name: 27 mobile flows, RU/EN pricing notices, no Stripe request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install headless Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify marketing site mobile and paid disclosures
        run: python tools/test_mobile_flows.py
      - name: Verify homepage viewport
        run: python tools/test_mobile_layout.py
