name: Mobile website viewport QA
on:
  push:
    branches: [fix/mobile-viewport-responsive-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-responsive:
    name: Android-size Chromium responsive layout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real Chromium for responsive testing
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check nine phone/tablet viewport widths
        run: python tools/test_mobile_layout.py
      - name: Save mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: murdilimax-mobile-layout-screenshots
          path: mobile-layout-artifacts/
          if-no-files-found: ignore
          retention-days: 7
