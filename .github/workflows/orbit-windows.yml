name: Build Murdilimax Orbit Windows Setup
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/orbit-windows.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare source
        shell: pwsh
        run: |
          Expand-Archive 'Murdilimax-Orbit-Windows-macOS-Beta.zip' -DestinationPath orbit-build -Force
          Copy-Item desktop/orbit_auth.py,desktop/account_ui.py,desktop/orbit_runtime.py orbit-build/MurdilimaxOrbit/
          @'
          from pathlib import Path
          p=Path('orbit-build/MurdilimaxOrbit/MurdilimaxOrbit.py')
          s=p.read_text(encoding='utf-8')
          needle='\ndef main():'
          assert needle in s
          inject='\nfrom account_ui import attach as aa\naa(PocketFleet, globals())\nfrom orbit_runtime import attach as ar\nar(PocketFleet, globals())\n'
          p.write_text(s.replace(needle,inject+needle,1),encoding='utf-8')
          '@ | python -
          python -m compileall -q orbit-build/MurdilimaxOrbit
      - name: Download official scrcpy and Android platform-tools
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://dl.google.com/android/repository/platform-tools-latest-windows.zip' -OutFile "$env:TEMP/orbit-adb.zip"
          Expand-Archive "$env:TEMP/orbit-adb.zip" "$env:TEMP/orbit-adb" -Force
          New-Item -ItemType Directory -Force 'orbit-build/MurdilimaxOrbit/tools' | Out-Null
          Copy-Item -Recurse "$env:TEMP/orbit-adb/platform-tools" 'orbit-build/MurdilimaxOrbit/tools/platform-tools'
          Invoke-WebRequest 'https://github.com/Genymobile/scrcpy/releases/download/v5.0.1/scrcpy-win64-v5.0.1.zip' -OutFile "$env:TEMP/orbit-scrcpy.zip"
          Expand-Archive "$env:TEMP/orbit-scrcpy.zip" "$env:TEMP/orbit-scrcpy" -Force
          $binary=Get-ChildItem "$env:TEMP/orbit-scrcpy" -Recurse -Filter scrcpy.exe | Select-Object -First 1
          if (!$binary) { throw 'scrcpy.exe not found' }
          New-Item -ItemType Directory -Force 'orbit-build/MurdilimaxOrbit/tools/scrcpy' | Out-Null
          Copy-Item "$($binary.DirectoryName)/*" -Destination 'orbit-build/MurdilimaxOrbit/tools/scrcpy/' -Recurse -Force
      - name: Install packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller camoufox keyring
      - name: Bundle Windows executable
        shell: pwsh
        run: |
          Set-Location 'orbit-build/MurdilimaxOrbit'
          python -m PyInstaller --noconfirm --clean --windowed --name 'Murdilimax Orbit' --collect-all camoufox --collect-all playwright --hidden-import keyring.backends.Windows --add-binary 'tools/platform-tools;tools/platform-tools' --add-binary 'tools/scrcpy;tools/scrcpy' MurdilimaxOrbit.py
          if (!(Test-Path 'dist/Murdilimax Orbit/Murdilimax Orbit.exe')) { throw 'EXE was not created' }
          & 'dist/Murdilimax Orbit/Murdilimax Orbit.exe' --check
      - name: Package single-click installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          @'
          [Setup]
          AppName=Murdilimax Orbit
          AppVersion=0.3.0
          DefaultDirName={autopf}\Murdilimax Orbit
          DefaultGroupName=Murdilimax Orbit
          PrivilegesRequired=lowest
          OutputDir=.
          OutputBaseFilename=Murdilimax-Orbit-Windows-Setup
          Compression=lzma
          SolidCompression=yes
          [Files]
          Source: "orbit-build\MurdilimaxOrbit\dist\Murdilimax Orbit\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          [Icons]
          Name: "{autoprograms}\Murdilimax Orbit"; Filename: "{app}\Murdilimax Orbit.exe"
          [Run]
          Filename: "{app}\Murdilimax Orbit.exe"; Description: "Launch Orbit"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content orbit-installer.iss -Encoding UTF8
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' orbit-installer.iss
          if (!(Test-Path 'Murdilimax-Orbit-Windows-Setup.exe')) { throw 'Installer not created' }
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Windows-Setup
          path: Murdilimax-Orbit-Windows-Setup.exe
          if-no-files-found: error
      - name: Publish installer release
        env:
          GH_TOKEN: \${{ github.token }}
        shell: pwsh
        run: |
          gh release view v0.3.0-win-beta | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.3.0-win-beta --prerelease --title 'Murdilimax Orbit Windows Beta 0.3' --notes 'Windows installer with integrated ADB/scrcpy and Android setup wizard. Android SDK system images require an additional download. Google account login requires owner OAuth configuration and account site public access.'
          }
          gh release upload v0.3.0-win-beta Murdilimax-Orbit-Windows-Setup.exe --clobber
