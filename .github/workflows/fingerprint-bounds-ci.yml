name: Safe fingerprint screen bounds and immutable profile QA
on:
  push:
    branches: [feature/safe-fingerprint-screen-bounds-20261101]
    paths:
      - 'browser/**'
      - '.github/workflows/fingerprint-bounds-ci.yml'
  pull_request:
    paths:
      - 'browser/**'
      - '.github/workflows/fingerprint-bounds-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: Fingerprint constraints + regression / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q browser
      - name: Verify immutable identity, bounds and old profiles
        run: python -m unittest discover -s browser -p 'test_fingerprint_options.py' -v
      - name: Run complete desktop unit suite
        run: python -m unittest discover -s browser -v
      - name: App smoke
        run: python browser/app.py --selftest
  real-windows:
    name: Real Camoufox coherent bound and cookie restarts / Windows x64
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and fetch browser
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -r browser/requirements.txt
          python -m camoufox fetch
      - name: Real Windows Camoufox fpgen bound acceptance
        run: python browser/integration_fingerprint_bounds.py
