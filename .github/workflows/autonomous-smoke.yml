name: Autonomous Answers — Fast CI
on:
  pull_request:
    paths:
      - 'scripts/autonomous_answers.py'
      - 'scripts/render-autonomous-answers.mjs'
      - 'tests/test_autonomous_answers.py'
      - 'tests/test-autonomous-render.mjs'
      - '.github/workflows/autonomous-answers.yml'
      - '.github/workflows/autonomous-smoke.yml'
      - 'editorial/autonomous/**'
  push:
    branches: [main]
    paths:
      - 'scripts/autonomous_answers.py'
      - 'scripts/render-autonomous-answers.mjs'
      - 'tests/test_autonomous_answers.py'
      - 'tests/test-autonomous-render.mjs'
      - '.github/workflows/autonomous-smoke.yml'
permissions:
  contents: read
jobs:
  fast-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test autonomous editorial safety gates without networking
        run: python -m unittest discover -s tests -p 'test_autonomous_answers.py' -v
      - name: Test bilingual static rendering without publication
        run: |
          node --check scripts/render-autonomous-answers.mjs
          node tests/test-autonomous-render.mjs
