name: Publish tested browser preview installers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-browser-preview.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-browser-preview
  cancel-in-progress: false

jobs:
  publish:
    name: Publish three direct-download installers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN: '41277440636'
      SOURCE_SHA: '848491c0fd52b1ceec5181091930ee38b3815a7a'
      RELEASE_TAG: 'v0.1.0-browser-preview-20261101'
    steps:
      - name: Verify successful browser-only Windows and macOS build
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.conclusion' | grep -qx success
          gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.head_sha' | grep -qx "$SOURCE_SHA"
          mkdir -p release windows intel silicon

      - name: Download official CI installers (not old Orbit builds)
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN" -R "$REPO" -n 'Murdilimax-Browser-Windows-Preview' -D windows
          gh run download "$SOURCE_RUN" -R "$REPO" -n 'Murdilimax-Browser-macOS-Intel-Preview' -D intel
          gh run download "$SOURCE_RUN" -R "$REPO" -n 'Murdilimax-Browser-macOS-Apple-Silicon-Preview' -D silicon
          cp 'windows/Murdilimax-Browser-Windows-Preview-Setup.exe' release/
          cp 'intel/Murdilimax-Browser-macOS-Intel-Preview.dmg' release/
          cp 'silicon/Murdilimax-Browser-macOS-Apple-Silicon-Preview.dmg' release/

      - name: Validate installers and create checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c %s release/Murdilimax-Browser-Windows-Preview-Setup.exe)" -gt 30000000
          test "$(stat -c %s release/Murdilimax-Browser-macOS-Intel-Preview.dmg)" -gt 30000000
          test "$(stat -c %s release/Murdilimax-Browser-macOS-Apple-Silicon-Preview.dmg)" -gt 30000000
          file release/*
          python - <<'PY'
          from pathlib import Path
          assert Path('release/Murdilimax-Browser-Windows-Preview-Setup.exe').read_bytes()[:2] == b'MZ'
          for name in ['Intel','Apple-Silicon']:
              p=Path(f'release/Murdilimax-Browser-macOS-{name}-Preview.dmg')
              with p.open('rb') as f:
                  f.seek(-512,2)
                  assert b'koly' in f.read(), f'Invalid UDIF trailer: {name}'
          PY
          cd release
          sha256sum *.exe *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create direct-download GitHub release (preview, not production)
        shell: bash
        run: |
          set -euo pipefail
          cat > NOTES.md <<'EOF'
          ## Murdilimax Browser — public preview (1 November 2026)

          Direct-download Windows setup and macOS Intel / Apple Silicon DMG packages.
          Built by the **browser-only** CI workflow at commit
          `848491c0fd52b1ceec5181091930ee38b3815a7a` (CI run 41277440636).

          **Early test version, not a signed production release.**
          - Windows: normal Setup.exe with shortcut and launch option. SmartScreen might warn because the publisher certificate is not yet signed.
          - Mac: drag the app from DMG to Applications. Packages are only ad-hoc signed, **not Apple-notarized**; macOS Gatekeeper can block first launch.
          - On first run, the app fetches the official Camoufox browser engine. Internet access is needed.
          - Sign in using the same email as the account site: desktop displays an 8-character pairing code, you confirm it in your browser. No password copied to the app.
          - **macOS Catalina 10.15 is not validated**. The Intel DMG was built on macOS 15 and must not be labeled Catalina-compatible.
          - Mobile: the separate `/mobile/` PWA companion is available on Android/iOS; it is not the desktop anti-detect engine.

          Download installers from murdilimax.com/download.html. SHA-256 checksums attached.
          EOF
          if gh release view "$RELEASE_TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* -R "$REPO" --clobber
          else
            gh release create "$RELEASE_TAG" release/* -R "$REPO" \
              --target "$SOURCE_SHA" --title 'Murdilimax Browser — 0.1.0 preview' \
              --notes-file NOTES.md --prerelease --latest=false
          fi

      - name: Verify direct download assets exist publicly
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" -R "$REPO" --json assets \
            --jq '.assets[].name' | sort > /tmp/assets.txt
          for f in Murdilimax-Browser-Windows-Preview-Setup.exe \
            Murdilimax-Browser-macOS-Intel-Preview.dmg \
            Murdilimax-Browser-macOS-Apple-Silicon-Preview.dmg SHA256SUMS.txt; do
              grep -Fxq "$f" /tmp/assets.txt
          done
          cat /tmp/assets.txt
