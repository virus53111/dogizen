name: Browser-only smoke tests
on:
  push:
    branches: [main, feature/orbit-browser-only-2026-10-31]
    paths: ['browser/**', '.github/workflows/browser-ci.yml']
  pull_request:
    paths: ['browser/**', '.github/workflows/browser-ci.yml']
  workflow_dispatch:
concurrency:
  group: browser-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests:
    name: Python store / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax validation
        run: python -m compileall -q browser
      - name: Offline unit tests
        working-directory: browser
        run: python -m unittest discover -v
      - name: CLI smoke test
        run: python browser/app.py --selftest
