name: Test large profile table
on:
  push:
    branches: [feature/profile-table-incremental-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-table:
    name: 1000-profile table / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python source
        run: python -m compileall -q browser
      - name: Test incremental rendering and multi-launch preflight
        run: |
          python -m unittest discover -s browser -p 'test_profile_table.py' -v
          python -m unittest discover -s browser -p 'test_profile_view.py' -v
      - name: Retest RU/EN and local cookie management
        run: |
          python -m unittest discover -s browser -p 'test_i18n.py' -v
          python -m unittest discover -s browser -p 'test_cookie_restore.py' -v
