name: Deploy Murdilimax to Namecheap (disabled until verified)
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['MURDILIMAX — Autonomous Answers']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: namecheap-murdilimax-com
  cancel-in-progress: false
jobs:
  deploy:
    # Set this repository variable only after the correct Namecheap target,
    # SSH host fingerprint, deploy key and domain marker have been verified.
    if: vars.NAMECHEAP_DEPLOY_ENABLED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Answer Atlas static site
        run: |
          npm run build
          test -s dist/index.html
          test -s dist/sitemap.xml
      - name: Upload to verified Namecheap directory (never delete remote files)
        shell: bash
        env:
          SSH_HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          SSH_USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          SSH_PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.NAMECHEAP_SSH_KNOWN_HOSTS }}
          DEPLOY_DIR: ${{ secrets.NAMECHEAP_SITE_DIR }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing NAMECHEAP_SSH_HOST}"
          : "${SSH_USER:?Missing NAMECHEAP_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing NAMECHEAP_SSH_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing NAMECHEAP_SSH_KNOWN_HOSTS}"
          : "${DEPLOY_DIR:?Missing NAMECHEAP_SITE_DIR}"
          SSH_PORT="${SSH_PORT:-21098}"
          [[ "$SSH_PORT" =~ ^[0-9]{2,5}$ ]] || exit 1
          [[ "$DEPLOY_DIR" =~ ^/home/[A-Za-z0-9_-]+(/[A-Za-z0-9._-]+)+$ ]] || { echo 'Unsafe deployment path'; exit 1; }
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/namecheap_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/namecheap_known_hosts"
          ssh_opts="-i $RUNNER_TEMP/namecheap_deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/namecheap_known_hosts -o BatchMode=yes"
          ssh $ssh_opts "$SSH_USER@$SSH_HOST" "test -d '$DEPLOY_DIR' && test -f '$DEPLOY_DIR/.deploy-domain' && grep -Fxq 'murdilimax.com' '$DEPLOY_DIR/.deploy-domain'" || { echo 'Domain marker missing or wrong directory; upload refused'; exit 1; }
          rsync -rtz --exclude='CNAME' --exclude='.deploy-domain' -e "ssh $ssh_opts" dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/"
