name: Deploy Murdilimax to Namecheap
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        default: test
        options: [test, production]
permissions:
  contents: read
concurrency:
  group: namecheap-murdilimax-com
  cancel-in-progress: false
jobs:
  validate:
    name: Validate static build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify site output
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html
          test -s dist/sitemap.xml
  deploy:
    needs: validate
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.target == 'test') ||
      (github.ref == 'refs/heads/main' && vars.NAMECHEAP_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || inputs.target == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Answer Atlas static site
        run: |
          npm run build
          test -s dist/index.html
          test -s dist/sitemap.xml
      - name: Upload to the site-specific SSH endpoint
        shell: bash
        env:
          SSH_HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          SSH_USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          SSH_PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.NAMECHEAP_SSH_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'production' }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing NAMECHEAP_SSH_HOST}"
          : "${SSH_USER:?Missing NAMECHEAP_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing NAMECHEAP_SSH_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing NAMECHEAP_SSH_KNOWN_HOSTS}"
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ && "$SSH_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{2,5}$ && "$DEPLOY_TARGET" =~ ^(test|production)$ ]]
          umask 077
          deploy_tmp="$(mktemp -d "$RUNNER_TEMP/namecheap.XXXXXXXX")"
          trap 'rm -f "$deploy_tmp/key" "$deploy_tmp/known_hosts" "$deploy_tmp/result"; rmdir "$deploy_tmp"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$deploy_tmp/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$deploy_tmp/known_hosts"
          source_dir='dist'
          index_checksum="$(sha256sum "$source_dir/index.html" | cut -d' ' -f1)"
          tar --exclude='./CNAME' --exclude='.htaccess' --exclude='.deploy-domain' --exclude='.env*' -czf - -C "$source_dir" . |
            ssh -T -i "$deploy_tmp/key" -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
              -o "UserKnownHostsFile=$deploy_tmp/known_hosts" -o ConnectTimeout=20 \
              "$SSH_USER@$SSH_HOST" namecheap-deploy "$DEPLOY_TARGET" 'murdilimax.com' |
            tee "$deploy_tmp/result"
          grep -Fxq 'site=murdilimax.com' "$deploy_tmp/result"
          grep -Fxq "target=$DEPLOY_TARGET" "$deploy_tmp/result"
          grep -Fxq "index_sha256=$index_checksum" "$deploy_tmp/result"
