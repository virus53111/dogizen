name: Real Camoufox Addon QA
on:
  push:
    branches: [qa/real-firefox-addon-integration-20261101, feature/orbit-browser-only-2026-10-31]
    paths: ['browser/addon_manager.py', 'browser/integration_addon.py', 'browser/engine.py', '.github/workflows/browser-addon-integration.yml']
  pull_request:
    paths: ['browser/addon_manager.py', 'browser/integration_addon.py', 'browser/engine.py', '.github/workflows/browser-addon-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  addon-engine:
    name: Local Firefox addon / Linux Camoufox
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Camoufox and browser
        run: |
          python -m pip install -r browser/requirements.txt
          python -m camoufox fetch
      - name: Run real Firefox addon lifecycle
        run: python browser/integration_addon.py
