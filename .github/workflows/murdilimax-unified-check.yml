name: MurdiliMax unified syntax check
on:
  push:
    branches:
      - release/murdilimax-unified-20261123
    paths:
      - 'dating-site/**'
      - '.github/workflows/murdilimax-unified-check.yml'
  pull_request:
    branches:
      - release/murdilimax-unified-20261123
    paths:
      - 'dating-site/**'
      - '.github/workflows/murdilimax-unified-check.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      vip-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: vip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: dating-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev
      - run: npm run check
      - run: find api public render -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm test
      - name: VIP isolated PostgreSQL integration
        env:
          VIP_TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/vip_test
        run: node --test tests/vip-postgres.integration.mjs

      - name: Test chat layouts with a pinned headless browser
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/mm-chat-browser"
          npx --yes playwright@1.56.1 install --with-deps --only-shell chromium
          export CHROME_BIN="$(find "$PLAYWRIGHT_BROWSERS_PATH" -name headless_shell -type f -print -quit)"
          test -x "$CHROME_BIN"
          node tests/mobile-chat-browser.mjs
