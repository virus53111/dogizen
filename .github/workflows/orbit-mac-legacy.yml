name: Build Murdilimax Orbit Legacy for macOS Catalina 10.15 Intel
on:
  push:
    branches: [main]
    paths:
      - 'desktop/legacy/**'
      - '.github/workflows/orbit-mac-legacy.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  legacy:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Inspect compiler and target
        shell: bash
        run: |
          uname -m
          xcrun --find clang
          xcrun --show-sdk-version
      - name: Compile native Cocoa/WebKit Intel app targeting macOS 10.15
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Murdilimax Orbit Legacy.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          xcrun clang \
            -arch x86_64 -mmacosx-version-min=10.15 \
            -std=gnu11 -fobjc-arc -fmodules \
            -Werror=unguarded-availability -O2 \
            -framework Cocoa -framework WebKit \
            -o "$APP/Contents/MacOS/Murdilimax Orbit Legacy" \
            desktop/legacy/OrbitLegacy.m
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>Murdilimax Orbit Legacy</string>
            <key>CFBundleIdentifier</key><string>com.murdilimax.orbit.legacy</string>
            <key>CFBundleName</key><string>Murdilimax Orbit Legacy</string>
            <key>CFBundleDisplayName</key><string>Murdilimax Orbit Legacy</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.6.0</string>
            <key>CFBundleVersion</key><string>6</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.productivity</string>
            <key>NSAppTransportSecurity</key><dict>
              <key>NSAllowsArbitraryLoads</key><false/>
            </dict>
          </dict></plist>
          PLIST
          cp desktop/legacy/dashboard.html "$APP/Contents/Resources/dashboard.html"
          test -s "$APP/Contents/Resources/dashboard.html"
          plutil -lint "$APP/Contents/Info.plist"
          file "$APP/Contents/MacOS/Murdilimax Orbit Legacy"
          otool -l "$APP/Contents/MacOS/Murdilimax Orbit Legacy" | grep -A5 'LC_BUILD_VERSION' | head -6
          test "$(file "$APP/Contents/MacOS/Murdilimax Orbit Legacy" | grep -c x86_64)" -gt 0
          DEPLOY_MIN="$(otool -l "$APP/Contents/MacOS/Murdilimax Orbit Legacy" | awk '/LC_BUILD_VERSION/{s=1} s&&/minos/{print $2;exit}')"
          echo "Minimum macOS: $DEPLOY_MIN"
          test "$DEPLOY_MIN" = "10.15"
      - name: Sign ad-hoc and create drag-and-drop DMG
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Murdilimax Orbit Legacy.app"
          codesign --force --sign - "$APP"
          codesign --verify --deep --verbose "$APP"
          "$APP/Contents/MacOS/Murdilimax Orbit Legacy" --check
          mkdir -p build/dmg
          ditto "$APP" "build/dmg/Murdilimax Orbit Legacy.app"
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "Murdilimax Orbit Legacy" \
            -srcfolder build/dmg -ov -format UDZO \
            "build/Murdilimax-Orbit-Studio-Legacy-macOS-10.15-Intel.dmg"
          shasum -a 256 "build/Murdilimax-Orbit-Studio-Legacy-macOS-10.15-Intel.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Legacy-Catalina-Intel
          path: build/Murdilimax-Orbit-Studio-Legacy-macOS-10.15-Intel.dmg
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.6.0-mac-legacy-studio-beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create v0.6.0-mac-legacy-studio-beta --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Murdilimax Orbit Studio 0.6 · Intel macOS 10.15+" \
              --notes "New GeeLark-style Orbit Studio layout with sidebar, device list, draggable/resizable multi-device cards and live ADB screenshot/touch controls. Device screenshots require a connected physical Android or compatible Android emulator/SDK. Demo layouts are NOT real Android. Browser profiles are isolated temporary WebKit windows, NOT anti-detect. Not Apple-notarized and not tested on real old Mac."
          gh release upload v0.6.0-mac-legacy-studio-beta \
            build/Murdilimax-Orbit-Studio-Legacy-macOS-10.15-Intel.dmg \
            --repo "$GITHUB_REPOSITORY" --clobber
