name: Enforce paid profiles in native browser launcher
on:
  push:
    branches: [fix/paid-profile-server-license-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  license:
    name: Free/paid launcher license enforcement / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile browser
        run: python -m compileall -q browser
      - name: Paid 4th-profile requires server entitlement
        run: python -m unittest discover -s browser -p 'test_paid_profile_launch.py' -v
      - name: Preserve existing commercial gate regression checks
        run: python -m unittest discover -s browser -p 'test_commercial_gate.py' -v
      - name: Preserve end-to-end simulated account entitlement
        run: python -m unittest discover -s browser -p 'test_onboarding_contract.py' -v
