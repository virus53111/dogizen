name: MURDIWORLD actual gameplay screenshot
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/murdiworld-capture.yml'
permissions:
  contents: write
jobs:
  game-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install real Luanti engine and virtual X display
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:minetestdevs/stable
          sudo apt-get update -qq
          sudo apt-get install -y minetest xvfb xdotool imagemagick unzip curl
          minetest --version
          minetest --version | grep -E '5\\.(1[0-9]|[2-9][0-9])\\.' || {
            echo 'Luanti 5.10+ required for VoxeLibre 0.92.4'; exit 1;
          }
      - name: Download exact public MURDIWORLD prototype and VoxeLibre
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mw/archive /tmp/mw/game /tmp/mw/home/.minetest/games
          curl --fail --location --retry 3 --max-time 180 -o /tmp/mw/murdiworld.zip "https://murdilimax.com/downloads/MURDIWORLD_Prototype_0.1.zip"
          echo 'f3fbd194049b6bf9db681aac60da726f2fbc1c61ba87458efb871cdd3e6d93b2  /tmp/mw/murdiworld.zip' | sha256sum -c -
          unzip -q /tmp/mw/murdiworld.zip -d /tmp/mw/archive
          curl --fail --location --retry 3 --max-time 300 -o /tmp/mw/voxelibre.zip "https://content.luanti.org/packages/Wuzzy/mineclone2/releases/39534/download/"
          unzip -q /tmp/mw/voxelibre.zip -d /tmp/mw/game
          GAME_CONF=$(find /tmp/mw/game -name game.conf -print -quit)
          test -n "$GAME_CONF"
          GAME_DIR=$(dirname "$GAME_CONF")
          test -f "$GAME_DIR/LICENSE.txt"
          cp -a "$GAME_DIR" /tmp/mw/home/.minetest/games/mineclone2
          MW_ROOT=$(dirname "$(find /tmp/mw/archive -name bootstrap.ps1 -print -quit)")
          test -d "$MW_ROOT/world-template/worldmods/mw_core"
          cp -a "$MW_ROOT/world-template" /tmp/mw/world
          cp "$MW_ROOT/config/solo.conf" /tmp/mw/solo.conf
          echo "MURDIWORLD_CONTENT_SOURCE=$MW_ROOT" >> "$GITHUB_ENV"
          echo 'Luanti+VoxeLibre+MURDIWORLD files downloaded and verified'
      - name: Launch actual 3D game and capture gameplay
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '3.3'
          DISPLAY: ':99'
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp >/tmp/mw/xvfb.log 2>&1 &
          sleep 4
          export HOME=/tmp/mw/home
          export MINETEST_USER_PATH=/tmp/mw/home/.minetest
          (minetest --go --world /tmp/mw/world --config /tmp/mw/solo.conf >/tmp/mw/luanti.log 2>&1) &
          PID=$!
          sleep 65
          echo '=== engine output tail ==='
          tail -90 /tmp/mw/luanti.log || true
          if ! kill -0 "$PID" 2>/dev/null; then echo 'Game exited before screenshot'; exit 1; fi
          grep -F '[mw_core] MURDIWORLD crystal quest enabled' /tmp/mw/luanti.log || { echo 'Game-specific mod was not loaded'; exit 1; }
          mkdir -p screenshots
          import -display "$DISPLAY" -window root screenshots/murdiworld-actual-gameplay.png
          identify screenshots/murdiworld-actual-gameplay.png
          test "$(stat -c %s screenshots/murdiworld-actual-gameplay.png)" -gt 25000
          kill "$PID" || true
      - name: Upload actual screenshot, engine log and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MURDIWORLD-real-gameplay-evidence
          path: |
            screenshots/murdiworld-actual-gameplay.png
            /tmp/mw/luanti.log
          if-no-files-found: warn
      - name: Publish screenshot for honest preview
        shell: bash
        run: |
          set -euo pipefail
          test -s screenshots/murdiworld-actual-gameplay.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screenshots/murdiworld-actual-gameplay.png
          git commit -m 'Add actual MURDIWORLD gameplay screenshot from real Luanti+VoxeLibre session'
          git push
