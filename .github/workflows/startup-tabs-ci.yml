name: Startup tabs Windows real browser and cross-platform unit QA
on:
  push:
    branches: [feature/browser-multi-start-tabs-20261101]
    paths:
      - 'browser/**'
      - '.github/workflows/startup-tabs-ci.yml'
  pull_request:
    paths:
      - 'browser/**'
      - '.github/workflows/startup-tabs-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: Startup tabs and existing store / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and startup tab tests
        run: |
          python -m compileall -q browser
          python -m unittest discover -s browser -p 'test_startup_tabs.py' -v
      - name: Regression tests for existing profiles and quotas
        run: |
          python -m unittest discover -s browser -p 'test_store.py' -v
          python -m unittest discover -s browser -p 'test_profile_import_quotas.py' -v
          python -m unittest discover -s browser -p 'test_launch_guard.py' -v
  windows-native:
    name: Actual Camoufox three startup tabs / Windows x64
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Camoufox and download engine
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -r browser/requirements.txt
          python -m camoufox fetch
      - name: Navigate three local tabs in real persistent browser twice
        run: python browser/integration_startup_tabs.py
