name: Local profile templates atomicity and platform QA
on:
  push:
    branches: [feature/local-profile-templates-20261102]
    paths: ['browser/**', '.github/workflows/profile-templates-ci.yml']
  pull_request:
    paths: ['browser/**', '.github/workflows/profile-templates-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Templates and full regressions / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q browser
      - name: Template atomicity, license quota and secrets isolation
        run: python -m unittest discover -s browser -p 'test_profile_templates.py' -v
      - name: Full existing browser regressions
        run: python -m unittest discover -s browser -v
      - name: App startup smoke
        run: python browser/app.py --selftest
