name: Build MURDILIMAX Recovery installer for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/murdilimax-windows-build.yml'
permissions:
  contents: write
jobs:
  windows-install:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install Qt 6, image preview and PyInstaller
        run: python -m pip install --disable-pip-version-check "PySide6-Essentials==6.8.3" "pillow>=11,<13" "pyinstaller==6.16.0"
      - name: Run full recovery regression suite including Qt UI smoke tests
        working-directory: desktop
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { throw 'Recovery or Qt UI tests failed' }
      - name: Verify real Windows volume enumeration and read-only access
        working-directory: desktop
        shell: pwsh
        run: |
          $env:MRD_VOLUME_SMOKE='1'
          python -m unittest test_volume_selection.WindowsVolumeIntegration -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows volume access smoke test failed' }
      - name: Verify Russian font glyphs on Windows
        working-directory: desktop
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          Write-Host "Installed OS font files:"
          Get-ChildItem "$env:WINDIR\Fonts" -ErrorAction SilentlyContinue | Select-Object -First 12 -ExpandProperty Name
          python -m unittest test_fontguard -v
          if ($LASTEXITCODE -ne 0) { throw 'Russian/Cyrillic glyph validation failed' }
      - name: Synthetic byte-for-byte recovery quality gate
        working-directory: desktop
        run: python murdilimax_qualitygate.py --out QUALITY-REPORT.json
      - name: Verify synthetic results and avoid unearned real-world claims
        working-directory: desktop
        shell: pwsh
        run: |
          $r = Get-Content 'QUALITY-REPORT.json' -Raw | ConvertFrom-Json
          if (!$r.summary.passed) { throw 'Synthetic quality gate failed' }
          if ($r.real_world_validated -or $r.competitor_comparison_performed) { throw 'Unsupported field validation claim' }
          Write-Output "Synthetic tests: $($r.summary.cases_passed)/$($r.summary.cases_total)"
      - name: Capture real empty Qt UI for release preview
        working-directory: desktop
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python murdilimax_crystal.py --capture-ui CRYSTAL-UI.png
          if ($LASTEXITCODE -ne 0 -or !(Test-Path 'CRYSTAL-UI.png')) { throw 'UI screenshot test failed' }
      - name: Package real Qt 6 Windows desktop application
        working-directory: desktop
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --uac-admin --noupx --name MURDILIMAX-Recovery --icon assets/murdilimax.ico --paths . murdilimax_crystal.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
      - name: Check packaged application exists
        shell: pwsh
        run: |
          $app = 'desktop/dist/MURDILIMAX-Recovery.exe'
          if (!(Test-Path $app) -or (Get-Item $app).Length -lt 1000000) { throw 'Qt executable not produced' }
      - name: Launch packaged Qt EXE in offscreen smoke test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          $app=(Resolve-Path 'desktop/dist/MURDILIMAX-Recovery.exe').Path
          $process=Start-Process -FilePath $app -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Packaged Qt app startup failed: $($process.ExitCode)" }
      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress --limit-output }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not available' }
      - name: Compile Windows installer
        shell: pwsh
        run: |
          Set-Location 'desktop'
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'windows-installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          $setup='installer-output/MURDILIMAX-Recovery-Setup-0.10.4.exe'
          if (!(Test-Path $setup)) { throw 'Installer not created' }
      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Set-Location 'desktop'
          $portable='dist/MURDILIMAX-Recovery.exe'
          $setup='installer-output/MURDILIMAX-Recovery-Setup-0.10.4.exe'
          $portableHash=(Get-FileHash $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupHash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  MURDILIMAX-Recovery-Setup-0.10.4.exe" | Set-Content -Encoding ascii 'SHA256SUMS.txt'
          "$portableHash  MURDILIMAX-Recovery.exe" | Add-Content -Encoding ascii 'SHA256SUMS.txt'
      - name: Upload tested installer and quality report
        uses: actions/upload-artifact@v4
        with:
          name: MURDILIMAX-Recovery-0.10.4-Windows
          path: |
            desktop/dist/MURDILIMAX-Recovery.exe
            desktop/installer-output/MURDILIMAX-Recovery-Setup-0.10.4.exe
            desktop/SHA256SUMS.txt
            desktop/QUALITY-REPORT.json
            desktop/CRYSTAL-UI.png
          if-no-files-found: error
      - name: Publish verified Recovery 0.10.4 downloads
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.10.4
          target_commitish: ${{ github.sha }}
          name: MURDILIMAX Recovery 0.10.4 — Whole drive selection / RU EN
          prerelease: true
          make_latest: false
          overwrite_files: false
          body: |
            Adds a dedicated whole-drive picker with drive letters (C:, D:), volume labels, sizes and filesystems. Selecting a drive never opens folders and passes the raw read-only volume to the recovery engine.
            Administrator permission is requested at startup for raw disk access. Recovery to the same physical disk is blocked, even if it has another drive letter.
            Windows may still write to a mounted volume. This is experimental software, not a consistent offline snapshot; recovery is not guaranteed. Existing physical system-disk imaging safeguards remain enabled.
          files: |
            desktop/dist/MURDILIMAX-Recovery.exe
            desktop/installer-output/MURDILIMAX-Recovery-Setup-0.10.4.exe
            desktop/SHA256SUMS.txt
            desktop/QUALITY-REPORT.json
            desktop/CRYSTAL-UI.png
          fail_on_unmatched_files: true
