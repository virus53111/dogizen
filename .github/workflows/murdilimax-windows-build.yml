name: Build MURDILIMAX Recovery installer for Windows
on:
  workflow_dispatch:
  push:
    branches: [price-aggregator-mvp]
    paths:
      - 'price-aggregator/desktop/**'
      - '.github/workflows/murdilimax-windows-build.yml'
permissions:
  contents: write
jobs:
  windows-install:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install Qt 6, Pillow and PyInstaller
        run: python -m pip install --disable-pip-version-check "PySide6-Essentials==6.8.3" "pillow>=11,<13" "pyinstaller==6.16.0"
      - name: Test recovery engine and Qt startup (offscreen)
        working-directory: price-aggregator/desktop
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { throw 'Recovery engine or Qt UI smoke tests failed' }
      - name: Synthetic recovery quality gate
        working-directory: price-aggregator/desktop
        run: python murdilimax_qualitygate.py --out QUALITY-REPORT.json
      - name: Validate quality report
        working-directory: price-aggregator/desktop
        shell: pwsh
        run: |
          $r=Get-Content 'QUALITY-REPORT.json' -Raw | ConvertFrom-Json
          if (!$r.summary.passed) { throw 'Synthetic quality gate failed' }
          if ($r.real_world_validated -or $r.competitor_comparison_performed) { throw 'Unsupported real-world validation claim' }
      - name: Package Crystal Qt Windows app
        working-directory: price-aggregator/desktop
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --noupx --name MURDILIMAX-Recovery --icon assets/murdilimax.ico --paths . murdilimax_crystal.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          if (!(Test-Path 'dist/MURDILIMAX-Recovery.exe')) { throw 'Missing EXE' }
      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress --limit-output }
          if (!(Test-Path $iscc)) { throw 'Inno Setup not found' }
      - name: Compile Windows setup installer
        shell: pwsh
        run: |
          Set-Location 'price-aggregator/desktop'
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'windows-installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          if (!(Test-Path 'installer-output/MURDILIMAX-Recovery-Setup-0.10.0.exe')) { throw 'Installer missing' }
      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          Set-Location 'price-aggregator/desktop'
          $a=(Get-FileHash 'installer-output/MURDILIMAX-Recovery-Setup-0.10.0.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $b=(Get-FileHash 'dist/MURDILIMAX-Recovery.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$a  MURDILIMAX-Recovery-Setup-0.10.0.exe" | Set-Content -Encoding ascii 'SHA256SUMS.txt'
          "$b  MURDILIMAX-Recovery.exe" | Add-Content -Encoding ascii 'SHA256SUMS.txt'
      - name: Upload packaged app and quality report
        uses: actions/upload-artifact@v4
        with:
          name: MURDILIMAX-Recovery-0.10.0-Windows
          path: |
            price-aggregator/desktop/dist/MURDILIMAX-Recovery.exe
            price-aggregator/desktop/installer-output/MURDILIMAX-Recovery-Setup-0.10.0.exe
            price-aggregator/desktop/SHA256SUMS.txt
            price-aggregator/desktop/QUALITY-REPORT.json
          if-no-files-found: error
      - name: Publish direct-download EXE release
        if: github.ref == 'refs/heads/price-aggregator-mvp'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.10.0
          target_commitish: price-aggregator-mvp
          name: MURDILIMAX Recovery 0.10.0 — Crystal Qt RU/EN
          prerelease: true
          make_latest: false
          body: |
            Real Qt 6 / PySide6 Windows desktop with new Crystal neon UI and RU/EN switch. Existing read-only recovery engine, actual scan results, metadata scanning, carving, photo preview and selective recovery.
            Advanced tools remain in a separate technical window.
            Unsigned experimental software, not field validated for failing physical media. Recover only to a different physical disk. Does not claim to outperform R-Studio/DMDE.
          files: |
            price-aggregator/desktop/dist/MURDILIMAX-Recovery.exe
            price-aggregator/desktop/installer-output/MURDILIMAX-Recovery-Setup-0.10.0.exe
            price-aggregator/desktop/SHA256SUMS.txt
            price-aggregator/desktop/QUALITY-REPORT.json
          fail_on_unmatched_files: true
          overwrite_files: true
