name: MURDILIMAX Windows exe build
on:
  push:
    branches: [price-aggregator-mvp]
    paths:
      - 'price-aggregator/desktop/**'
      - '.github/workflows/murdilimax-windows-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test recovery engine
        working-directory: price-aggregator/desktop
        run: python -m unittest -v test_engine test_advanced
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build .exe
        working-directory: price-aggregator/desktop
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name MURDILIMAX-Recovery --paths . murdilimax_recovery_v02.py
      - uses: actions/upload-artifact@v4
        with:
          name: MURDILIMAX-Recovery-Windows
          path: price-aggregator/desktop/dist/MURDILIMAX-Recovery.exe
          if-no-files-found: error
