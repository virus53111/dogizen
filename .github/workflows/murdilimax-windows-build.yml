name: Build MURDILIMAX Recovery installer for Windows
on:
  workflow_dispatch:
  push:
    branches: [price-aggregator-mvp]
    paths:
      - 'price-aggregator/desktop/**'
      - '.github/workflows/murdilimax-windows-build.yml'
permissions:
  contents: write
jobs:
  windows-install:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install photo preview dependency
        run: python -m pip install --disable-pip-version-check 'pillow>=11,<13'
      - name: Test recovery engine
        working-directory: price-aggregator/desktop
        run: python -m unittest discover -v
      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0
      - name: Package standalone desktop app
        working-directory: price-aggregator/desktop
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --noupx --name MURDILIMAX-Recovery --icon assets/murdilimax.ico --paths . murdilimax_recovery_v04.py
      - name: Verify packaged app exists
        shell: pwsh
        run: |
          $app = 'price-aggregator/desktop/dist/MURDILIMAX-Recovery.exe'
          if (!(Test-Path $app)) { throw 'PyInstaller did not produce an EXE.' }
          if ((Get-Item $app).Length -lt 1000000) { throw 'Unexpectedly small executable.' }
      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress --limit-output }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not available' }
      - name: Compile Windows setup installer
        shell: pwsh
        run: |
          Set-Location 'price-aggregator/desktop'
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'windows-installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          $setup='installer-output/MURDILIMAX-Recovery-Setup-0.8.exe'
          if (!(Test-Path $setup)) { throw 'Installer not created' }
          Get-FileHash $setup -Algorithm SHA256 | Format-List
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Set-Location 'price-aggregator/desktop'
          $portable = 'dist/MURDILIMAX-Recovery.exe'
          $setup = 'installer-output/MURDILIMAX-Recovery-Setup-0.8.exe'
          $portableHash = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  MURDILIMAX-Recovery-Setup-0.8.exe" | Set-Content -Encoding ascii 'SHA256SUMS.txt'
          "$portableHash  MURDILIMAX-Recovery.exe" | Add-Content -Encoding ascii 'SHA256SUMS.txt'
      - name: Upload installers as downloadable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MURDILIMAX-Recovery-0.8-Windows
          path: |
            price-aggregator/desktop/dist/MURDILIMAX-Recovery.exe
            price-aggregator/desktop/installer-output/MURDILIMAX-Recovery-Setup-0.8.exe
            price-aggregator/desktop/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish direct-download release
        if: github.ref == 'refs/heads/price-aggregator-mvp'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.0
          target_commitish: ${{ github.sha }}
          name: MURDILIMAX Recovery 0.8.0 — Windows Alpha
          prerelease: true
          make_latest: false
          body: |
            Experimental Windows x64 recovery tool. Stage 4: read-only ext4 exploration and selective extraction of EXISTING extent-backed files from disk images, with directory structure and sparse-file support. Identifies locked LUKS 1/2 and BitLocker containers and requires owner-authorized unlocking with official OS utilities. Previously available NTFS/exFAT undelete, safe imaging and experimental RAID0/1/5/6/10 remain available. Setup EXE is installer; other EXE portable.
            Does not require Python. Includes read-only NTFS/exFAT deleted-file candidates, ext4 existing-file export only, limited RAID image reconstruction and safe-imaging experiments. RAID6 fixed-pq-last only: NOT generic NAS or Linux md layouts. RAID10 near-2 only.
            WARNING: unsigned Windows build, not validated on real damaged devices or real-world ext4 corpora. Windows SmartScreen may show a warning. EXT4 UNDELETE, fscrypt decryption and BitLocker/LUKS password bypass are NOT implemented.
            Save recovered data to a different physical drive. Never scan a physically failing drive without professional guidance.
          files: |
            price-aggregator/desktop/dist/MURDILIMAX-Recovery.exe
            price-aggregator/desktop/installer-output/MURDILIMAX-Recovery-Setup-0.8.exe
            price-aggregator/desktop/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
