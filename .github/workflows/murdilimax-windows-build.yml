name: Build MURDILIMAX Recovery installer for Windows
on:
  workflow_dispatch:
  push:
    branches: [price-aggregator-mvp]
    paths:
      - 'price-aggregator/desktop/**'
      - '.github/workflows/murdilimax-windows-build.yml'
permissions:
  contents: write
jobs:
  windows-install:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install photo preview dependency
        run: python -m pip install --disable-pip-version-check 'pillow>=11,<13'
      - name: Test recovery engine
        working-directory: price-aggregator/desktop
        run: python -m unittest discover -v
      - name: Synthetic byte-for-byte recovery quality gate
        working-directory: price-aggregator/desktop
        run: python murdilimax_qualitygate.py --out QUALITY-REPORT.json
      - name: Verify quality report and fail closed
        working-directory: price-aggregator/desktop
        shell: pwsh
        run: |
          $r = Get-Content 'QUALITY-REPORT.json' -Raw | ConvertFrom-Json
          if (!$r.summary.passed) { throw 'Synthetic quality gate failed' }
          if ($r.real_world_validated -or $r.competitor_comparison_performed) { throw 'Invalid field-validation claim' }
          Write-Output "Synthetic tests: $($r.summary.cases_passed)/$($r.summary.cases_total)"
      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0
      - name: Package standalone desktop app
        working-directory: price-aggregator/desktop
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --noupx --name MURDILIMAX-Recovery --icon assets/murdilimax.ico --paths . murdilimax_recovery_v04.py
      - name: Verify packaged app exists
        shell: pwsh
        run: |
          $app = 'price-aggregator/desktop/dist/MURDILIMAX-Recovery.exe'
          if (!(Test-Path $app)) { throw 'PyInstaller did not produce an EXE.' }
          if ((Get-Item $app).Length -lt 1000000) { throw 'Unexpectedly small executable.' }
      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress --limit-output }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not available' }
      - name: Compile Windows setup installer
        shell: pwsh
        run: |
          Set-Location 'price-aggregator/desktop'
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'windows-installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          $setup='installer-output/MURDILIMAX-Recovery-Setup-0.9.1.exe'
          if (!(Test-Path $setup)) { throw 'Installer not created' }
          Get-FileHash $setup -Algorithm SHA256 | Format-List
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Set-Location 'price-aggregator/desktop'
          $portable = 'dist/MURDILIMAX-Recovery.exe'
          $setup = 'installer-output/MURDILIMAX-Recovery-Setup-0.9.1.exe'
          $portableHash = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  MURDILIMAX-Recovery-Setup-0.9.1.exe" | Set-Content -Encoding ascii 'SHA256SUMS.txt'
          "$portableHash  MURDILIMAX-Recovery.exe" | Add-Content -Encoding ascii 'SHA256SUMS.txt'
      - name: Upload installers as downloadable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MURDILIMAX-Recovery-0.9.1-Windows
          path: |
            price-aggregator/desktop/dist/MURDILIMAX-Recovery.exe
            price-aggregator/desktop/installer-output/MURDILIMAX-Recovery-Setup-0.9.1.exe
            price-aggregator/desktop/SHA256SUMS.txt
            price-aggregator/desktop/QUALITY-REPORT.json
          if-no-files-found: error
      - name: Publish direct-download release
        if: github.ref == 'refs/heads/price-aggregator-mvp'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.1
          target_commitish: ${{ github.sha }}
          name: MURDILIMAX Recovery 0.9.1 — Stage 6 Quality Gate
          prerelease: true
          make_latest: false
          body: |
            Experimental MURDILIMAX Recovery 0.9 for Windows x64. Stage 5: local filename-only wallet backup finder (no contents, keys or seed phrases accessed), rule-based offline recovery advice, conservative bounded verification for SQLite, images and MP4.
            Existing NTFS/exFAT, ext4 browsing, read-only imaging and experimental RAID features remain. Setup EXE installs without Python; other EXE portable.
            WARNING: unsigned alpha; physical device and RAID field testing incomplete. No wallet password bypass, private key extraction or guaranteed data recovery. For failing disks stop and seek specialist help. Recover to another healthy disk.
          files: |
            price-aggregator/desktop/dist/MURDILIMAX-Recovery.exe
            price-aggregator/desktop/installer-output/MURDILIMAX-Recovery-Setup-0.9.1.exe
            price-aggregator/desktop/SHA256SUMS.txt
            price-aggregator/desktop/QUALITY-REPORT.json
          fail_on_unmatched_files: true
          overwrite_files: true
