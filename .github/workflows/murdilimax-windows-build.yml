name: Build MURDILIMAX Recovery installer for Windows
on:
  workflow_dispatch:
  push:
    branches: [price-aggregator-mvp]
    paths:
      - 'price-aggregator/desktop/**'
      - '.github/workflows/murdilimax-windows-build.yml'
permissions:
  contents: write
jobs:
  windows-install:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install Qt 6, image preview and PyInstaller
        run: python -m pip install --disable-pip-version-check "PySide6-Essentials==6.8.3" "pillow>=11,<13" "pyinstaller==6.16.0"
      - name: Run full recovery regression suite including Qt UI smoke tests
        working-directory: price-aggregator/desktop
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { throw 'Recovery or Qt UI tests failed' }
      - name: Verify Russian font glyphs on Windows
        working-directory: price-aggregator/desktop
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          Write-Host "Installed OS font files:"
          Get-ChildItem "$env:WINDIR\Fonts" -ErrorAction SilentlyContinue | Select-Object -First 12 -ExpandProperty Name
          python -m unittest test_fontguard -v
          if ($LASTEXITCODE -ne 0) { throw 'Russian/Cyrillic glyph validation failed' }
      - name: Synthetic byte-for-byte recovery quality gate
        working-directory: price-aggregator/desktop
        run: python murdilimax_qualitygate.py --out QUALITY-REPORT.json
      - name: Verify synthetic results and avoid unearned real-world claims
        working-directory: price-aggregator/desktop
        shell: pwsh
        run: |
          $r = Get-Content 'QUALITY-REPORT.json' -Raw | ConvertFrom-Json
          if (!$r.summary.passed) { throw 'Synthetic quality gate failed' }
          if ($r.real_world_validated -or $r.competitor_comparison_performed) { throw 'Unsupported field validation claim' }
          Write-Output "Synthetic tests: $($r.summary.cases_passed)/$($r.summary.cases_total)"
      - name: Capture real empty Qt UI for release preview
        working-directory: price-aggregator/desktop
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python murdilimax_crystal.py --capture-ui CRYSTAL-UI.png
          if ($LASTEXITCODE -ne 0 -or !(Test-Path 'CRYSTAL-UI.png')) { throw 'UI screenshot test failed' }
      - name: Package real Qt 6 Windows desktop application
        working-directory: price-aggregator/desktop
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --noupx --name MURDILIMAX-Recovery --icon assets/murdilimax.ico --paths . murdilimax_crystal.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
      - name: Check packaged application exists
        shell: pwsh
        run: |
          $app = 'price-aggregator/desktop/dist/MURDILIMAX-Recovery.exe'
          if (!(Test-Path $app) -or (Get-Item $app).Length -lt 1000000) { throw 'Qt executable not produced' }
      - name: Launch packaged Qt EXE in offscreen smoke test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          $app=(Resolve-Path 'price-aggregator/desktop/dist/MURDILIMAX-Recovery.exe').Path
          $process=Start-Process -FilePath $app -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Packaged Qt app startup failed: $($process.ExitCode)" }
      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress --limit-output }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not available' }
      - name: Compile Windows installer
        shell: pwsh
        run: |
          Set-Location 'price-aggregator/desktop'
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'windows-installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          $setup='installer-output/MURDILIMAX-Recovery-Setup-0.10.3.exe'
          if (!(Test-Path $setup)) { throw 'Installer not created' }
      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Set-Location 'price-aggregator/desktop'
          $portable='dist/MURDILIMAX-Recovery.exe'
          $setup='installer-output/MURDILIMAX-Recovery-Setup-0.10.3.exe'
          $portableHash=(Get-FileHash $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupHash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  MURDILIMAX-Recovery-Setup-0.10.3.exe" | Set-Content -Encoding ascii 'SHA256SUMS.txt'
          "$portableHash  MURDILIMAX-Recovery.exe" | Add-Content -Encoding ascii 'SHA256SUMS.txt'
      - name: Upload tested installer and quality report
        uses: actions/upload-artifact@v4
        with:
          name: MURDILIMAX-Recovery-0.10.3-Windows
          path: |
            price-aggregator/desktop/dist/MURDILIMAX-Recovery.exe
            price-aggregator/desktop/installer-output/MURDILIMAX-Recovery-Setup-0.10.3.exe
            price-aggregator/desktop/SHA256SUMS.txt
            price-aggregator/desktop/QUALITY-REPORT.json
            price-aggregator/desktop/CRYSTAL-UI.png
          if-no-files-found: error
      - name: Publish direct download after all gates pass
        if: github.ref == 'refs/heads/price-aggregator-mvp'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.10.3
          target_commitish: ${{ github.sha }}
          name: MURDILIMAX Recovery 0.10.3 — Crystal Session Safety / RU EN
          prerelease: true
          make_latest: false
          body: |
            A real Qt 6 Windows x64 desktop UI (PySide6) matching the MURDILIMAX crystal website style, with Russian/English switching, vector art, real scan progress and real filesystem recovery results. Includes source/image selection, preview, selective recovery, safe imaging, experimental RAID builder, local wallet filename discovery and audit reports.
            0.10.3 fixes Russian glyph tofu: uses real system fonts verified through Qt physical glyph coverage, and CI fails closed when Cyrillic rendering is not available. Scan sessions and source-switch safety remain unchanged.
            WARNING: unsigned experimental build; not field validated on failing physical disks or vendor RAID. Do not write outputs to the source disk. Never claim superiority to R-Studio or DMDE without independent tests.
          files: |
            price-aggregator/desktop/dist/MURDILIMAX-Recovery.exe
            price-aggregator/desktop/installer-output/MURDILIMAX-Recovery-Setup-0.10.3.exe
            price-aggregator/desktop/SHA256SUMS.txt
            price-aggregator/desktop/QUALITY-REPORT.json
          fail_on_unmatched_files: true
          overwrite_files: true
