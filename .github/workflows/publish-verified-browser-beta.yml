name: Publish verified Murdilimax desktop beta 2026-11-01
on:
  push:
    branches: [feature/orbit-browser-only-2026-10-31]
    paths:
      - '.github/workflows/publish-verified-browser-beta.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    name: Publish release assets from verified Windows and macOS installers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '41308541345'
      SOURCE_SHA: 'ed993f8d1326cf65a18f2b2d86d2644b4dd452b6'
      TAG: 'v0.2.0-browser-beta-20261101'
    steps:
      - name: Verify source run and provenance
        shell: bash
        run: |
          set -euo pipefail
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.conclusion')
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.head_sha')
          test "$conclusion" = success
          test "$sha" = "$SOURCE_SHA"
          echo "Verified source: $sha from Actions run $SOURCE_RUN"
      - name: Download ALL three verified build artifacts
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --dir downloaded
          for name in Murdilimax-Browser-Windows-Preview-Setup.exe Murdilimax-Browser-macOS-Intel-Preview.dmg Murdilimax-Browser-macOS-Apple-Silicon-Preview.dmg; do
            file=$(find downloaded -type f -name "$name" -print -quit)
            test -n "$file" && test -s "$file"
            cp "$file" "$name"
          done
          sha256sum Murdilimax-Browser-Windows-Preview-Setup.exe \
            Murdilimax-Browser-macOS-Intel-Preview.dmg \
            Murdilimax-Browser-macOS-Apple-Silicon-Preview.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish preview, keep prior versions for rollback
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Tag already has a release; refusing to silently overwrite installer assets"
            exit 1
          fi
          cat > RELEASE_NOTES.md <<'EOF'
          ## Murdilimax Browser — experimental desktop beta

          This is an **early-access beta, not Dolphin Anty feature parity**.
          It is for Windows 10/11 x64 and macOS Intel / Apple Silicon.
          Windows 7 is **not supported**.

          ### Included in the build
          - Persistent isolated Camoufox/Firefox browser profiles with stable baseline fingerprints.
          - Per-profile proxy settings and offline proxy import/diagnostics.
          - Groups, filters, column sorting and optimized large-profile table.
          - Per-profile Firefox add-on (XPI/ZIP) management.
          - Cookie inspection, manually approved sensitive export, backup,
            clearing and restoration **from the same profile's own backup**.
          - RU/EN interface, safer duplicate-launch handling and device account pairing.

          ### Limitations — read before installation
          - Physical Windows/Mac user-device installation and GUI QA are still pending.
          - macOS bundles are ad-hoc signed, **not Apple Developer ID notarized**.
            Gatekeeper may block them. They are not Apple-approved binaries.
          - The first profile launch downloads the Camoufox engine and may need internet.
          - No cloud profile sync, advanced fingerprint editor, action synchronizer,
            local automation API, managed team workspaces, or arbitrary cookie import.
          - Paid account enforcement in the current preview is not a production-grade DRM guarantee.
          - Browser extensions can access sensitive website sessions. Install only trusted XPI.
          - This beta has no automatic updater. Keep backup copies of your profile data
            before installing or changing versions.
          - These packages are previews and have no Microsoft/Apple store certification.

          ### Verified automated checks
          - GitHub Actions run 41308541345 successfully built all three packages.
          - Windows: silent Setup.exe installation + installed-app selftest passed.
          - macOS Intel and Apple Silicon: DMG mount, copy .app and installed selftest passed.
          - Native Camoufox tests: persistent profiles, Firefox extensions,
            SQLite cookie restore and synthetic local HTTP proxy routing passed on
            Windows x64, macOS Intel, macOS Apple Silicon and Linux.
          - Does not prove security against every fingerprint/antifraud detector.

          Release packages originate from build run **41308541345**, source commit
          **ed993f8d1326cf65a18f2b2d86d2644b4dd452b6**.
          Check SHA256SUMS.txt after downloading.
          No live Stripe payments were tested or modified for this release.
          EOF
          gh release create "$TAG" \
            ./Murdilimax-Browser-Windows-Preview-Setup.exe \
            ./Murdilimax-Browser-macOS-Intel-Preview.dmg \
            ./Murdilimax-Browser-macOS-Apple-Silicon-Preview.dmg \
            ./SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --prerelease \
            --title "Murdilimax Browser v0.2.0 — Experimental Desktop Beta" \
            --notes-file RELEASE_NOTES.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isPrerelease,assets,url \
            --jq '{url:.url,prerelease:.isPrerelease,assets:[.assets[].name]}'
