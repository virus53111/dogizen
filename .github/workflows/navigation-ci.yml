name: Session-bound browser navigation security and native acceptance
on:
  push:
    branches: [feature/browser-navigation-command-20261102]
    paths: ['browser/**', '.github/workflows/navigation-ci.yml']
  pull_request:
    paths: ['browser/**', '.github/workflows/navigation-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Navigation IPC and full browser regression / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: python -m compileall -q browser
      - name: Session ownership, security and never-persisted URL tests
        run: python -m unittest discover -s browser -p 'test_navigation_commands.py' -v
      - name: Full pre-existing browser regressions
        run: python -m unittest discover -s browser -v
      - name: App CLI smoke
        run: python browser/app.py --selftest
  native-windows:
    name: Real Camoufox private navigation and persisted cookies / Windows
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and fetch Camoufox
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -r browser/requirements.txt
          python -m camoufox fetch
      - name: Navigate real Camoufox to localhost and reject stale browser sessions
        run: python browser/integration_navigation.py
