name: Murdilimax Neon Flow Studio QA
on:
  push:
    branches: [feature/neon-visual-workflow-builder-20261102]
    paths: ['browser/**', '.github/workflows/visual-flow-ci.yml']
  pull_request:
    paths: ['browser/**', '.github/workflows/visual-flow-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: Original visual builder and full regressions / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q browser
      - run: python -m unittest discover -s browser -p 'test_visual_workflows.py' -v
      - run: python -m unittest discover -s browser -p 'test_visual_ipc.py' -v
      - run: python -m unittest discover -s browser -v
      - run: python browser/app.py --selftest
  native:
    name: Real Camoufox Murdilimax Flow Studio blocks / Windows
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real browser
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -r browser/requirements.txt
          python -m camoufox fetch
      - run: python browser/integration_visual_flow.py
