name: Check profile sort and table UX
on:
  push:
    branches: [feature/profile-table-column-sorting-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-manager:
    name: Sort/search/profile table / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile browser
        run: python -m compileall -q browser
      - name: Test stable profile sorting, search and bulk launch
        run: |
          python -m unittest discover -s browser -p 'test_profile_view.py' -v
          python -m unittest discover -s browser -p 'test_profile_table.py' -v
      - name: Test UI translations
        run: python -m unittest discover -s browser -p 'test_i18n.py' -v
