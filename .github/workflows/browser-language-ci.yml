name: Check Murdilimax RU EN desktop UI
on:
  push:
    branches:
      - feature/browser-ru-en-20261101
  workflow_dispatch:
permissions:
  contents: read
jobs:
  i18n-tests:
    name: RU/EN UI source and settings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile browser
        run: python -m compileall -q browser
      - name: Unit tests for language and preferences
        run: python -m unittest discover -s browser -p 'test_i18n.py' -v
