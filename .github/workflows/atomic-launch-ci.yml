name: Atomic browser launch QA
on:
  push:
    branches: [feature/atomic-profile-startup-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch-qa:
    name: Duplicate-start regression / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all browser Python files
        run: python -m compileall -q browser
      - name: Test startup locking and stop signal preservation
        run: python -m unittest discover -s browser -p 'test_launch_guard.py' -v
      - name: Test existing profile, cookie and extensions safeguards
        run: |
          python -m unittest discover -s browser -p 'test_engine.py' -v
          python -m unittest discover -s browser -p 'test_profile_view.py' -v
          python -m unittest discover -s browser -p 'test_cookie_manager.py' -v
          python -m unittest discover -s browser -p 'test_addon_manager.py' -v
