name: Publish MURDILIMAX Recovery
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'download.html'
      - '404.html'
      - 'favicon.svg'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'CNAME'
      - 'tools/check_site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate recovery site
        run: node tools/check_site.mjs
      - uses: actions/configure-pages@v5
      - name: Stage only public website files
        run: |
          mkdir -p _site
          cp index.html download.html 404.html favicon.svg robots.txt sitemap.xml CNAME _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
