name: Publish MURDILIMAX Объявления
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: murdilimax-pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate RU/LV/EN site, map and listing workflows
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat CNAME)" = "murdilimax.com"
          for f in index.html style.css app.js i18n.js favicon.svg robots.txt sitemap.xml; do test -s "$f"; done
          node --check app.js
          node --check i18n.js
          grep -q 'id="view-map"' index.html
          grep -q 'id="map-canvas"' index.html
          grep -q 'data-lang="lv"' index.html
          grep -q 'data-lang="en"' index.html
          grep -q 'OpenStreetMap' app.js
          grep -q '/api/map' app.js
          grep -q '/api/create' app.js
          grep -q '/api/delete' app.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),sandbox={window:{}};
          vm.runInNewContext(fs.readFileSync('i18n.js','utf8'),sandbox);
          const d=sandbox.window.MURDI_I18N;
          const keys=Object.keys(d.ru).sort();
          for(const lang of ['ru','lv','en']){
            const present=Object.keys(d[lang]).sort();
            if(JSON.stringify(keys)!==JSON.stringify(present))throw Error('Key mismatch: '+lang);
            if(keys.some(k=>!String(d[lang][k]).trim()))throw Error('Empty key in '+lang);
          }
          const html=fs.readFileSync('index.html','utf8');
          for(const [_,key] of html.matchAll(/data-i18n(?:-html|-placeholder)?="([^"]+)"/g)){
            if(!keys.includes(key))throw Error('Missing translation: '+key);
          }
          console.log('PASS: RU/LV/EN, listing forms, map and account controls');
          NODE
          test ! -d recovery
          test ! -d downloads
          test ! -d guide
          ! grep -iq 'MURDIWORLD' index.html
          ! grep -iq 'MURDILIMAX Recovery' index.html
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage public marketplace files
        run: |
          mkdir -p _site
          cp index.html style.css app.js i18n.js favicon.svg robots.txt sitemap.xml CNAME 404.html _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
