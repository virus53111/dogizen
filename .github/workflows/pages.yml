name: Publish MURDILIMAX Объявления
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: murdilimax-pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check standalone classifieds site
        shell: bash
        run: |
          set -euo pipefail
          test -f CNAME
          grep -Fxq murdilimax.com CNAME
          grep -q 'Объявления и недвижимость' index.html
          grep -q 'class="listing-grid"' index.html
          grep -q '/api/listings' app.js
          node --check app.js
          for p in index.html style.css app.js favicon.svg robots.txt sitemap.xml; do test -s "$p"; done
          test ! -d recovery
          test ! -d downloads
          test ! -d guide
          ! grep -iq 'MURDIWORLD' index.html
          ! grep -iq 'MURDILIMAX Recovery' index.html
          echo "PASS: new classifieds site, no legacy game or recovery files"
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage only public classifieds website assets
        shell: bash
        run: |
          mkdir -p _site
          cp index.html style.css app.js favicon.svg robots.txt sitemap.xml CNAME 404.html _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
