name: Publish MURDILIMAX — The Answer Atlas
on:
  push:
    branches: [main, feature/visual-species-encyclopedia-20261109]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: murdilimax-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate multilingual pages and generate static website
        run: |
          node --check lib/atlas-data.js
          node --check lib/world-topics.js
          node --check lib/world-articles.js
          node --check lib/world-intros.js
          node --check lib/species-atlas.js
          node --check lib/species-render.js
          node --check lib/species-mushroom-content.js
          node --check lib/species-fish-content.js
          node --check lib/species-plant-content.js
          node --check lib/species-labels.js
          node --check lib/atlas-baltic-translations.js
          node --check lib/atlas-site.js
          node --check public/site.js
          node scripts/build-atlas.mjs
          test -s dist/index.html
          test -s dist/ru/guides/ryzen-upgrade/index.html
          test -s dist/de/tools/percentage/index.html
          grep -q 'murdilimax.com' dist/CNAME
          grep -q 'hreflang="de"' dist/index.html
          grep -q 'hreflang="pt"' dist/index.html
          grep -q 'Windows 10' dist/ru/guides/windows-10-support-2026/index.html
          test -s dist/pt/guides/ddr4-ddr5/index.html
          test -s dist/pl/guides/secure-accounts/index.html
          test -s dist/it/index.html
          ! test -e dist/pl/guides/spot-phishing/index.html
          test -s dist/lt/index.html
          test -s dist/et/index.html
          test -s dist/nl/index.html
          test -s dist/et/guides/ryzen-upgrade/index.html
          test -s dist/lt/topics/mushrooms/index.html
          test -s dist/nl/topics/fishing/index.html
          test -s dist/ru/guides/mold-moisture-home/index.html
          test -s dist/en-fake-never-index/index.html || true
          ! test -e dist/lt/guides/mold-moisture-home/index.html
          grep -q 'noindex,follow' dist/lt/topics/construction/index.html
          grep -q 'Грибы' dist/ru/topics/mushrooms/index.html
          grep -q 'Amanita phalloides' dist/ru/topics/mushrooms/index.html
          test -s dist/ru/species/amanita-phalloides/index.html
          test -s dist/species/esox-lucius/index.html
          test -s dist/ru/species/atropa-belladonna/index.html
          test -s dist/ru/topics/mushrooms/index.html
          grep -q 'data-species-search' dist/ru/topics/mushrooms/index.html
          grep -q 'upload.wikimedia.org' dist/ru/topics/mushrooms/index.html
          grep -q 'Бледная поганка' dist/ru/species/amanita-phalloides/index.html
          grep -q 'Где встречается' dist/ru/species/amanita-phalloides/index.html
          grep -q 'image:loc' dist/sitemap.xml
          grep -q 'xhtml:link' dist/sitemap.xml
          node --input-type=module -e "import {visualSpecies} from './lib/species-atlas.js'; if(visualSpecies.length !== 78||visualSpecies.some(x=>!x.image||!x.photoCredit||!x.detail.ru||!x.detail.en)) process.exit(2);"
          grep -q 'Как обновить старый Ryzen' dist/ru/guides/ryzen-upgrade/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Notify IndexNow search engines of published URLs
        continue-on-error: true
        run: node scripts/indexnow-submit.mjs