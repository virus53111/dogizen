name: Publish MURDILIMAX
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate crawlable pages and site metadata
        run: python tools/check_site.py
      - name: Render high-resolution site icons and social preview
        run: |
          python -m pip install 'pillow>=10,<13' 'cairosvg>=2.7,<3'
          python tools/build_brand_assets.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow after successful deployment
        if: success()
        continue-on-error: true
        run: python tools/notify_indexnow.py
