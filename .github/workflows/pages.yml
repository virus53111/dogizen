name: Publish MURDILIMAX
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Configure custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f cname=murdilimax.com; then
            echo "Custom domain configured"
          else
            echo "::warning::GitHub token cannot configure custom domain; repository Pages admin access is needed."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
