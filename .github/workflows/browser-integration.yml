name: Browser engine end-to-end test
on:
  push:
    branches: [feature/orbit-browser-only-2026-10-31]
    paths: ['browser/integration_browser.py', '.github/workflows/browser-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Camoufox dependencies
        run: |
          python -m pip install -r browser/requirements.txt
          python -m camoufox fetch
      - name: Run real browser persistence test
        run: python browser/integration_browser.py
