name: Check Murdilimax bulk proxy import
on:
  push:
    branches:
      - feature/browser-bulk-proxy-import-20261101
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proxy-import-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile browser sources
        run: python -m compileall -q browser
      - name: Validate bulk proxy import & language
        run: |
          python -m unittest discover -s browser -p 'test_proxy_import.py' -v
          python -m unittest discover -s browser -p 'test_i18n.py' -v
