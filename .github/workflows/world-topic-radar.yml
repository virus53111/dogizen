name: MURDILIMAX — World Topic Radar
on:
  # Research only: scheduled runs never publish articles or send forum replies.
  schedule:
    - cron: '17 7,19 * * *'
  workflow_dispatch:
  # First report runs automatically when this workflow is merged to main.
  push:
    branches: [main]
    paths:
      - 'scripts/world_topic_radar.py'
      - 'tests/test_world_topic_radar.py'
      - 'scripts/topic_opportunity_engine.py'
      - 'tests/test_topic_opportunity_engine.py'
      - 'scripts/editorial_draft_studio.py'
      - 'tests/test_editorial_draft_studio.py'
      - 'scripts/editorial_evidence_pack.py'
      - 'tests/test_editorial_evidence_pack.py'
      - 'scripts/prepare_publication_candidate.py'
      - 'tests/test_prepare_publication_candidate.py'
      - '.github/workflows/world-topic-radar.yml'
  pull_request:
    paths:
      - 'scripts/world_topic_radar.py'
      - 'tests/test_world_topic_radar.py'
      - 'scripts/topic_opportunity_engine.py'
      - 'tests/test_topic_opportunity_engine.py'
      - 'scripts/editorial_draft_studio.py'
      - 'tests/test_editorial_draft_studio.py'
      - 'scripts/editorial_evidence_pack.py'
      - 'tests/test_editorial_evidence_pack.py'
      - 'scripts/prepare_publication_candidate.py'
      - 'tests/test_prepare_publication_candidate.py'
      - '.github/workflows/world-topic-radar.yml'
permissions:
  contents: read
  issues: write
concurrency:
  group: world-topic-radar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test feed parsing, source safety and deduplication offline
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Collect global public interest signals
        if: github.event_name != 'pull_request'
        run: >-
          python scripts/world_topic_radar.py
          --geos US,GB,DE,FR,ES,IN,BR,JP,LV,CA
          --wikis en,de,es,fr,ru
          --count 12
          --output reports/world-topic-radar
      - name: Prepare free editorial research and one optional anonymous AI draft
        if: github.event_name != 'pull_request'
        timeout-minutes: 4
        # No API secret, payment account, or paid fallback is ever used.
        run: |
          python scripts/editorial_draft_studio.py --ai --max-ai 1 --output reports/world-topic-radar/drafts
          printf '\n- [Open this workflow run to download the draft artifacts](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> reports/world-topic-radar/report.md
      - name: Build original visual article previews with source and image-license audit
        if: github.event_name != 'pull_request'
        timeout-minutes: 3
        run: |
          python scripts/editorial_evidence_pack.py --output reports/world-topic-radar/previews --drafts-dir reports/world-topic-radar/drafts
      - name: Save the report and research data for review
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: murdilimax-world-topic-radar
          path: reports/world-topic-radar/
          retention-days: 30
          if-no-files-found: warn
      - name: Create or refresh one editorial review issue
        if: success() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='MURDILIMAX World Topic Radar'
          issue="$(gh issue list --state open --search 'MURDILIMAX World Topic Radar in:title' --limit 50 --json number,title --jq '.[] | select(.title == "MURDILIMAX World Topic Radar") | .number' | head -n 1)"
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file reports/world-topic-radar/report.md
          else
            gh issue create --title "$title" --body-file reports/world-topic-radar/report.md
          fi
