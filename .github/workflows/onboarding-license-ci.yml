name: Browser onboarding and license contract QA
on:
  push:
    branches: [qa/account-pairing-license-contract-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  onboarding:
    name: Account pairing + license / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile browser sources
        run: python -m compileall -q browser
      - name: Test full synthetic pairing and license contract
        run: python -m unittest discover -s browser -p 'test_onboarding_contract.py' -v
      - name: Run existing token and commercial gate regressions
        run: |
          python -m unittest discover -s browser -p 'test_auth_client.py' -v
          python -m unittest discover -s browser -p 'test_commercial_gate.py' -v
