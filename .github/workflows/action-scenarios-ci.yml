name: Local browser action scenarios and entitlement QA
on:
  push:
    branches: [feature/local-action-scenarios-20261102]
    paths: ['browser/**', '.github/workflows/action-scenarios-ci.yml']
  pull_request:
    paths: ['browser/**', '.github/workflows/action-scenarios-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Local scenarios and full regressions / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python and UI
        run: python -m compileall -q browser
      - name: Explicit workflow cancellation and paid access regressions
        run: python -m unittest discover -s browser -p 'test_action_scenarios.py' -v
      - name: Full offline browser regression suite
        run: python -m unittest discover -s browser -v
      - name: GUI CLI smoke
        run: python browser/app.py --selftest
