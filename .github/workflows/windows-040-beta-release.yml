name: Release Murdilimax Browser 0.4.0 Windows test beta (startup tabs)
on:
  push:
    branches: [release/windows-browser-beta-040-20261101]
    paths:
      - '.github/workflows/windows-beta-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-browser-v040-beta-publish
  cancel-in-progress: false
jobs:
  build-and-publish:
    name: Verify, build, install and publish Windows x64 beta
    runs-on: windows-2025
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.4.0-browser-windows-beta-20261101
      SETUP_NAME: Murdilimax-Browser-Windows-v0.4.0-Beta-Setup.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r browser/requirements.txt pyinstaller 'pillow>=10,<13'
      - name: Compile, run all browser unit tests and CLI smoke
        run: |
          python -m compileall -q browser
          python -m unittest discover -s browser -v
          python browser/app.py --selftest
      - name: Fetch real Camoufox and verify persistent Windows profiles
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m camoufox fetch
          python browser/integration_browser.py
          python browser/integration_startup_tabs.py
          python browser/integration_cookie_import.py
          python browser/integration_cookie_restore.py
          python browser/integration_addon.py
          python browser/integration_proxy.py
      - name: Generate unchanged-brand icons and pinned fingerprint resources
        env:
          MURDILIMAX_BRAND_PNG: assets/generated/icon-1024.png
        run: |
          npm install --no-save --no-package-lock @resvg/resvg-js@2.6.2
          node -e 'const fs=require("fs"); const {Resvg}=require("@resvg/resvg-js"); fs.mkdirSync("assets/generated",{recursive:true}); const r=new Resvg(fs.readFileSync("assets/murdilimax-icon.svg","utf8"),{fitTo:{mode:"width",value:1024}}); fs.writeFileSync("assets/generated/icon-1024.png",r.render().asPng());'
          python tools/build_brand_assets.py
          python -c "from camoufox.fpgen_model import ensure_fpgen_model, is_pinned; ensure_fpgen_model(); assert is_pinned()"
      - name: Build desktop Windows executable without changing product design
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name "Murdilimax Browser" --icon assets/generated/murdilimax.ico --add-data "assets/generated/app-icon-512.png:assets/generated" --collect-all camoufox --collect-all fpgen --collect-all language_tags --collect-data language_tags --collect-all browserforge --collect-all playwright --hidden-import keyring.backends.Windows --paths browser browser/app.py
      - name: Packaged Windows app selftest
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/Murdilimax Browser/Murdilimax Browser.exe').Path
          $proc = Start-Process -FilePath $exe -ArgumentList @('--selftest') -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Packaged Windows selftest failed with $($proc.ExitCode)" }
      - name: Create Windows setup installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          @'
          [Setup]
          AppName=Murdilimax Browser
          AppVersion=0.4.0
          SetupIconFile=assets\generated\murdilimax.ico
          DefaultDirName={autopf}\Murdilimax Browser
          DefaultGroupName=Murdilimax Browser
          PrivilegesRequired=lowest
          OutputDir=.
          OutputBaseFilename=Murdilimax-Browser-Windows-v0.4.0-Beta-Setup
          Compression=lzma
          SolidCompression=yes
          [Files]
          Source: "dist\Murdilimax Browser\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          [Icons]
          Name: "{autoprograms}\Murdilimax Browser"; Filename: "{app}\Murdilimax Browser.exe"
          [Run]
          Filename: "{app}\Murdilimax Browser.exe"; Description: "Launch"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content browser-beta.iss -Encoding UTF8
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' browser-beta.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          if (!(Test-Path $env:SETUP_NAME)) { throw "Installer not generated" }
      - name: Silent installer integration test on clean runner directory
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'Murdilimax-v040-installed'
          $installer = (Resolve-Path $env:SETUP_NAME).Path
          $setup = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $dest + '"')) -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed with $($setup.ExitCode)" }
          $exe = Join-Path $dest 'Murdilimax Browser.exe'
          if (!(Test-Path $exe)) { throw "Installed app was not found" }
          $test = Start-Process -FilePath $exe -ArgumentList @('--selftest') -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Installed selftest failed with $($test.ExitCode)" }
          $sha = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash.ToLowerInvariant()
          "$sha  $env:SETUP_NAME" | Set-Content -Encoding ascii SHA256SUMS.txt
          Write-Host "PASS: real Camoufox, browser tests, Setup.exe install, installed-app selftest"
          Get-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Murdilimax-Browser-Windows-v0.4.0-Beta-QA
          path: |
            Murdilimax-Browser-Windows-v0.4.0-Beta-Setup.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 60
      - name: Publish NEW prerelease only after every Windows gate passes
        shell: pwsh
        run: |
          & gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release tag already exists, refusing overwrite" }
          & gh release create $env:TAG $env:SETUP_NAME 'SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title 'Murdilimax Browser v0.4.0 — Windows Test Beta' --notes-file docs/WINDOWS_040_TESTING_RU.md
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publish failed" }
          & gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json url,assets,isPrerelease
          if ($LASTEXITCODE -ne 0) { throw "GitHub release verification failed" }
