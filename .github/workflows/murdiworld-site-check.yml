name: Check MURDIWORLD website package
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'guide/**'
      - 'recovery/**'
      - 'downloads/**'
      - 'assets/**'
      - 'tools/check_site.mjs'
      - 'tools/check_site_visual.mjs'
      - 'sitemap.xml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/murdiworld-site-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check HTML, links, guide, ZIP SHA256, preserved Recovery
        run: node tools/check_site.mjs
      - name: Open and validate actual game ZIP contents
        shell: bash
        run: |
          python - <<'PY'
          import zipfile,hashlib,pathlib
          p=pathlib.Path('downloads/MURDIWORLD_Prototype_0.1.zip')
          assert p.stat().st_size == 19641
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'f3fbd194049b6bf9db681aac60da726f2fbc1c61ba87458efb871cdd3e6d93b2'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              for f in ['PLAY.cmd','SERVER.cmd','JOIN.cmd','BACKUP.cmd','VERIFY.cmd','bootstrap.ps1','world-template/worldmods/mw_core/init.lua','world-template/worldmods/mw_core/textures/mw_shard.png']:
                  assert any(n.endswith('/'+f) for n in names), f
          print('Verified source ZIP, CRC and all launch/gameplay entrypoints')
          PY

      - name: Install headless Chromium visual test dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.57.0
          npx playwright install chromium
      - name: Render and verify desktop and mobile website
        run: node tools/check_site_visual.mjs
      - name: Save visual test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MURDIWORLD-Cinematic-Site-Desktop-Mobile
          path: site-preview/
          if-no-files-found: warn
