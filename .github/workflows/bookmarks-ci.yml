name: Local bookmarks security and native Windows acceptance
on:
  push:
    branches: [feature/bookmark-dashboard-20261101]
    paths: ['browser/**', '.github/workflows/bookmarks-ci.yml']
  pull_request:
    paths: ['browser/**', '.github/workflows/bookmarks-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: Bookmark security and profile regression / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q browser
      - name: Validate bookmark isolation and escaped dashboard
        run: python -m unittest discover -s browser -p 'test_bookmarks.py' -v
      - name: Run all existing Python unit regressions
        run: python -m unittest discover -s browser -v
      - name: Check app CLI starts
        run: python browser/app.py --selftest
  native-windows:
    name: Real Camoufox offline bookmark dashboard / Windows
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Camoufox and browser
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -r browser/requirements.txt
          python -m camoufox fetch
      - name: Test bookmark dashboard and cookies after restart
        run: python browser/integration_bookmarks.py
