name: MURDILIMAX — Autonomous Answers
on:
  schedule:
    # Twice weekly; at most one low-risk, source-linked EN/RU article per run.
    - cron: '43 10 * * 2,5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/autonomous_answers.py'
      - 'scripts/render-autonomous-answers.mjs'
      - '.github/workflows/autonomous-answers.yml'
permissions:
  contents: write
concurrency:
  group: murdilimax-autonomous-answers
  cancel-in-progress: false
jobs:
  autonomous:
    if: github.repository == 'virus53111/dogizen'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover fresh Wikipedia interest signals without paid APIs
        run: |
          python scripts/world_topic_radar.py --geos '' --wikis en --count 30 --output reports/autonomous
      - name: Generate at most one free model-assisted answer, or safely skip
        run: |
          python scripts/autonomous_answers.py --input reports/autonomous/topics.json --output editorial/autonomous
      - name: Detect article
        id: changed
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- editorial/autonomous)" ]]; then
            echo "new_article=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_article=false" >> "$GITHUB_OUTPUT"
            echo "Nothing eligible or free inference unavailable; publication skipped."
          fi
      - name: Test site, new canonical pages, links, and existing article validation
        if: steps.changed.outputs.new_article == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -q
          node --check scripts/render-autonomous-answers.mjs
          node tests/test-autonomous-render.mjs
          npm run build
          test -s dist/answers/index.html
          test -s dist/ru/answers/index.html
          grep -q '/answers/' dist/sitemap.xml
          node scripts/validate-reviewed-publication.mjs --built
      - name: Commit new source article (GitHub Pages receives workflow_run event)
        if: steps.changed.outputs.new_article == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MURDILIMAX Autonomous Answers Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial/autonomous/
          git diff --cached --quiet && exit 0
          git commit -m "content(auto): publish one low-risk bilingual source-linked answer"
          git push origin HEAD:main
