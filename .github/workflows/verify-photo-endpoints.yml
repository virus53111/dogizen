name: Verify real photo download endpoints
on:
  push:
    branches: [feature/ten-illustrated-bilingual-guides-20261109]
    paths: [.github/workflows/verify-photo-endpoints.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Test real photographic file downloads and JPEG signatures
        shell: bash
        run: |
          set +e
          urls=(
            'https://unsplash.com/photos/43ak6tfF4Ss/download?force=true&w=1200'
            'https://unsplash.com/photos/YunxbqyMGYo/download?force=true&w=1200'
            'https://unsplash.com/photos/5lmi2lh2oGU/download?force=true&w=1200'
            'https://unsplash.com/photos/ptgjRj9-lD8/download?force=true&w=1200'
            'https://images.unsplash.com/photo-1547592180-85f173990554?w=1100&fm=jpg&q=75'
          )
          for i in "${!urls[@]}"; do
            echo "=== IMAGE $i ==="
            curl -L -sS --max-time 24 -A 'Mozilla/5.0' -o /tmp/testphoto-$i -w 'status=%{http_code} content_type=%{content_type} bytes=%{size_download} final=%{url_effective}\n' "${urls[$i]}"
            file /tmp/testphoto-$i
            head -c 12 /tmp/testphoto-$i | od -A n -t x1
          done
