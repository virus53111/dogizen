<!doctype html><html lang="ru"><head><meta name="robots" content="noindex, nofollow, noarchive"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Модерация — MurdiliMax</title><link rel="stylesheet" href="/style.css"><style>body{background:#f7f5f8}.admin-shell{max-width:1020px;margin:45px auto 100px;padding:0 20px}.admin-shell h1{font:800 32px Manrope;letter-spacing:-1.2px;margin-bottom:6px}.admin-shell p{color:#8c8497}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}.stat-box{padding:20px;border:1px solid #eee7f0;background:#fff;border-radius:14px}.stat-box strong{display:block;font-size:30px}.stat-box span{font-size:12px;color:#9f98a8}.admin-tabs{display:flex;gap:8px;margin-bottom:17px}.ad-row{padding:20px;margin:12px 0;background:#fff;border:1px solid #eee7f0;border-radius:13px}.ad-row h3{font-size:19px}.ad-meta{font-size:12px;color:#aaa0af;margin:5px 0}.ad-desc{font-size:13px;color:#736b7d;margin:12px 0;white-space:pre-line}.ad-buttons{display:flex;gap:8px}.reports{margin-top:30px}.report{padding:13px;border:1px solid #e7d9d9;border-radius:10px;background:#fff;margin:7px 0;color:#67515a}.admin-msg{margin:15px 0;color:#c2677f}@media(max-width:500px){.stats{grid-template-columns:1fr 1fr}.admin-top{flex-direction:column;align-items:flex-start}}</style></head><body><header class="nav-wrap"><div class="nav container"><a class="brand" href="/"><span class="brand-icon">m<span>•</span></span>murdili<span class="brand-pink">max</span></a><a class="btn btn-outline" href="/">← Каталог</a></div></header><main class="admin-shell"><div class="admin-top"><div><span class="kicker">CONTROL ROOM / 18+</span><h1>Панель модерации</h1><p>Проверяйте анкеты перед их публикацией.</p></div><button class="btn btn-dark" onclick="refresh()">Обновить ↻</button></div><div class="stats" id="stats"></div><div class="admin-tabs"><button data-status="pending" class="chip selected">На проверке</button><button data-status="approved" class="chip">Опубликованы</button><button data-status="rejected" class="chip">Отклонены</button></div><div id="message" class="admin-msg"></div><div id="list"></div><section class="reports" id="reportsWorkbench"><h2>Жалобы пользователей</h2><p>Проверка жалоб на объявления и переписки. Содержимое жалоб доступно только администратору.</p><div class="admin-tabs"><button class="chip selected" data-report-type="listing">На объявления</button><button class="chip" data-report-type="chat">На переписки</button></div><div class="admin-tabs"><button class="chip selected" data-report-status="open">Новые</button><button class="chip" data-report-status="resolved">Обработанные</button><button class="chip" data-report-status="dismissed">Отклонённые</button></div><div class="admin-msg" id="reportError"></div><div id="reportQueue"></div><div id="reports" class="hidden"></div></section></main><script>
let status="pending";const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.querySelectorAll("[data-status]").forEach(b=>b.onclick=()=>{status=b.dataset.status;document.querySelectorAll("[data-status]").forEach(x=>x.classList.toggle("selected",x===b));refresh()});
async function refresh(){const msg=document.getElementById("message");msg.textContent="";try{const r=await fetch("/api/admin/listings?status="+encodeURIComponent(status));if(r.status===401||r.status===403){msg.textContent="Для доступа нужна учётная запись владельца проекта Hatchable.";return}if(!r.ok)throw Error("Ошибка "+r.status);const x=await r.json();document.getElementById("stats").innerHTML=["pending","approved","rejected"].map(s=>'<div class="stat-box"><strong>'+((x.stats.find(o=>o.status===s)||{}).total||0)+'</strong><span>'+({pending:"На проверке",approved:"Опубликованы",rejected:"Отклонены"}[s])+'</span></div>').join("");document.getElementById("list").innerHTML=x.listings.length?x.listings.map(p=>'<article class="ad-row"><h3>'+esc(p.display_name)+', '+Number(p.age)+'</h3><div class="ad-meta">'+esc(p.country)+' · '+esc(p.city)+' · '+esc(p.district)+' · '+esc(p.category)+' · '+esc(p.created_at)+'</div>'+(p.photos||[]).map(src=>'<a href="'+esc(src)+'" target="_blank" rel="noopener"><img src="'+esc(src)+'" alt="Фото для проверки" style="width:100px;height:120px;object-fit:cover"></a>').join("")+'<div class="ad-desc">'+(p.headline?'<strong>'+esc(p.headline)+'</strong><br>':'')+esc(p.description)+'</div><div class="ad-buttons"><button class="btn btn-dark" data-id="'+esc(p.id)+'" data-action="approved">Одобрить</button><button class="btn btn-outline" data-id="'+esc(p.id)+'" data-action="rejected">Отклонить</button>'+(p.status==="approved"?'<button class="btn btn-outline" data-id="'+esc(p.id)+'" data-action="feature" data-featured="'+(!p.featured)+'">'+(p.featured?"Убрать VIP":"★ VIP (тест)")+'</button>':'')+'</div></article>').join(""):'<div class="empty"><h3>Нет анкет</h3><p>В этой категории пока пусто.</p></div>';document.getElementById("reports").innerHTML=x.reports.length?x.reports.map(q=>'<div class="report"><strong>'+esc(q.reason)+'</strong><br><small>'+esc(q.display_name)+' · '+esc(q.created_at)+'</small></div>').join(""):"Жалоб пока нет"}catch(e){msg.textContent=e.message}}
document.getElementById("list").onclick=async e=>{const b=e.target.closest("[data-action]");if(!b)return;b.disabled=true;try{const r=await fetch("/api/admin/listings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b.dataset.action==="feature"?{id:b.dataset.id,action:"feature",featured:b.dataset.featured==="true"}:{id:b.dataset.id,status:b.dataset.action})});if(!r.ok)throw Error("Не удалось изменить статус");await refresh()}catch(e){document.getElementById("message").textContent=e.message}finally{b.disabled=false}};
refresh();
</script><script defer src="/admin-reports.js"></script></body></html>
