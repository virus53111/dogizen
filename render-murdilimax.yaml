services:
  - type: web
    name: murdilimax-unified
    runtime: node
    plan: free
    region: frankfurt
    rootDir: dating-site
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: murdilimax-unified-db
          property: connectionString
databases:
  - name: murdilimax-unified-db
    plan: free
    region: frankfurt