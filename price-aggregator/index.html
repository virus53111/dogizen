const rows=raw.map((r,id)=>({id,cat:r[0],names:r[1].split('|'),unit:r[2],lo:r[3],hi:r[4]}));const langs=['ru','lv','en','uk'];let lang=document.documentElement.lang||'ru',cat=0,selected=new Map();if(!I[lang])lang='ru';const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat(lang==='uk'?'uk-UA':lang==='lv'?'lv-LV':lang==='en'?'en-GB':'ru-RU',{maximumFractionDigits:0}).format(n),unit=(u)=>u==='шт'?({ru:'шт',lv:'gab.',en:'item',uk:'шт'}[lang]):u;function render(){let t=I[lang],idx=langs.indexOf(lang);document.documentElement.lang=lang;document.title=`CenaRadar — ${t.footer}`;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);document.querySelectorAll('[data-lang]').forEach(e=>e.classList.toggle('active',e.dataset.lang===lang));$('#search').placeholder=t.search;$('#categories').innerHTML=t.cats.map((x,i)=>`<button data-cat="${i}" class="${i===cat?'active':''}">${x}</button>`).join('');let q=$('#search').value.trim().toLocaleLowerCase();let filtered=rows.filter(r=>(!cat||r.cat===cat)&&(!q||r.names.some(n=>n.toLocaleLowerCase().includes(q))));$('#count').textContent=t.count(filtered.length);$('#works').innerHTML=filtered.length?filtered.map(r=>`<div class="work"><div class="workname">${r.names[idx]}<small>${t.cats[r.cat]}</small></div><div class="price">€${r.lo}–${r.hi} / ${unit(r.unit)}</div><button class="add" data-add="${r.id}" aria-label="${t.add}: ${r.names[idx]}">+ ${t.add}</button></div>`).join(''):`<div class="empty">${t.noResults}</div>`;$('#items').innerHTML=selected.size?[...selected].map(([id,qty])=>{let r=rows[id];return `<div class="line"><div class="line-top"><span>${r.names[idx]}</span><button data-remove="${id}" aria-label="×">×</button></div><div class="line-bottom"><div class="qty"><button data-minus="${id}" aria-label="−">−</button><input data-qty="${id}" type="number" min="0.1" max="100000" step="any" value="${qty}" aria-label="${r.names[idx]}"><span>${unit(r.unit)}</span><button data-plus="${id}" aria-label="+">+</button></div><span class="line-price">€${money(qty*r.lo)}–${money(qty*r.hi)}</span></div></div>`}).join(''):`<div class="empty">${t.empty}</div>`;let sum=[...selected].reduce((a,[id,q])=>[a[0]+rows[id].lo*q,a[1]+rows[id].hi*q],[0,0]);$('#total').textContent=`€${money(sum[0])}–${money(sum[1])}`};document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.cat!==undefined){cat=+b.dataset.cat;render()}if(b.dataset.add!==undefined){let id=+b.dataset.add;selected.set(id,(selected.get(id)||0)+1);render()}if(b.dataset.remove!==undefined){selected.delete(+b.dataset.remove);render()}if(b.dataset.plus!==undefined){let id=+b.dataset.plus;selected.set(id,Math.round(((selected.get(id)||0)+1)*100)/100);render()}if(b.dataset.minus!==undefined){let id=+b.dataset.minus;selected.set(id,Math.max(.1,Math.round(((selected.get(id)||0)-1)*100)/100));render()}});$('#search').addEventListener('input',render);document.addEventListener('change',e=>{if(e.target.dataset.qty!==undefined){let id=+e.target.dataset.qty,v=Number(e.target.value);selected.set(id,Number.isFinite(v)?Math.min(100000,Math.max(.1,v)):1);render()}});render();
