<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Редактор историй · MurdiliMax</title><link rel="stylesheet" href="/stories.css?v=1"><script>window.MM_authReady=new Promise(r=>{window.MM_finishAuth=r;setTimeout(r,10000)})</script><script type="module" src="/auth/refresh.js"></script><script defer src="/admin-stories.js?v=1"></script></head><body><header class="story-nav"><a class="brand" href="/">MurdiliMax</a><a href="/admin.html">Админка</a><a href="/stories/">Библиотека</a></header><main class="story-wrap story-admin"><h1>Истории 18+</h1><p id="gate" role="status">Проверяем права администратора…</p><div id="editor" hidden><p>Публикуйте неэксплицитные истории о знакомствах, любви и отношениях взрослых по взаимному согласию. Только свои тексты или материалы с разрешением правообладателя.</p><form id="form"><label>Название<input name="title" maxlength="150" minlength="3" required></label><label>Автор / ник<input name="author_name" maxlength="80" required></label><label>Язык текста<select name="language"><option value="ru">Русский</option><option value="en">English</option><option value="de">Deutsch</option><option value="lv">Latviešu</option><option value="lt">Lietuvių</option><option value="et">Eesti</option></select></label><label>Категория<select name="category"><option value="real-life">Истории из жизни</option><option value="romance">Любовные истории</option><option value="relationships">Отношения</option><option value="fiction">Художественные рассказы</option></select></label><label>Текст истории<textarea name="body" rows="14" minlength="40" maxlength="50000" required></textarea></label><label>SEO-заголовок (необязательно)<input name="seo_title" maxlength="150" placeholder="По умолчанию название истории"></label><label>SEO-описание (необязательно)<textarea name="seo_description" rows="3" maxlength="200" placeholder="По умолчанию начало текста"></textarea></label><label class="story-confirm"><input type="checkbox" name="editorial_confirmed"> Подтверждаю права на публикацию, достоверность маркировки и соблюдение правил: все участники совершеннолетние, согласие взаимное; без порнографии, инцеста, сексуального насилия и чужих личных данных.</label><div class="actions"><button type="submit" value="draft">Сохранить черновик</button><button type="submit" value="published">Опубликовать</button><button type="button" id="newStory">Новая история</button></div></form><p id="status" role="status"></p><p id="publishedLink"></p><h2>Мои публикации</h2><div id="list"></div><div class="actions"><button id="prev" type="button" hidden>← Назад</button><button id="next" type="button" hidden>Далее →</button></div></div></main></body></html>
