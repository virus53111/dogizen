<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Вход · MurdiliMax</title>
<link rel="stylesheet" href="/auth/account.css"><link rel="stylesheet" href="/auth/luxury-auth.css?v=20261125-email"></head>
<body><main>
<a href="/" class="brand">MurdiliMax</a>
<h1 id="title">Вход</h1>
<div class="auth-modes"><button id="loginMode" type="button" aria-pressed="true">Войти</button><button id="registerMode" type="button" aria-pressed="false">Регистрация по email</button></div><p id="modeHint">Новый пользователь? Выберите «Регистрация по email».</p>
<form id="account">
<label for="email">Электронная почта</label><input id="email" type="email" autocomplete="email" required>
<label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required>
<button id="submit" class="primary">Войти</button></form>
<p id="status" role="status" aria-live="polite"></p>
<section id="verifyPanel" hidden><h2 id="verifyTitle">Подтвердите электронную почту</h2><p id="verifyAddress"></p><button id="resend" type="button">Отправить повторно</button><button id="checkVerified" type="button" class="primary">Я подтвердил почту</button><button id="otherAccount" type="button" class="link">Использовать другой аккаунт</button></section>
<button id="reset" type="button" class="link">Забыли пароль?</button>
<div class="or">или</div>
<button id="google" type="button">Продолжить с Google</button>
<p class="switch"><span id="prompt">Нет аккаунта?</span> <button class="link" id="switchMode" type="button">Зарегистрироваться</button></p>
</main><script type="module" src="/auth/login.js?v=20261125-recovery"></script>
