<!doctype html><html lang="ru"><head><meta name="robots" content="noindex, nofollow, noarchive"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — MurdiliMax</title><link rel="stylesheet" href="/style.css"><style>body{min-height:100vh;background:linear-gradient(130deg,#1b1730,#433252);display:flex;align-items:center;justify-content:center;padding:18px}.auth-card{background:#fff;border-radius:23px;max-width:430px;width:100%;padding:38px;box-shadow:0 30px 90px #09041755}.auth-card h1{font:800 28px Manrope,Arial;letter-spacing:-1.5px;margin:25px 0 8px}.auth-card p{color:#827b8c;margin-bottom:24px;font-size:13px}.auth-card form{display:grid;gap:12px}.auth-card label{font-weight:800;font-size:12px}.auth-card input{width:100%;padding:13px 15px;border:1px solid #ded8e3;border-radius:11px;outline:0}.auth-card input:focus{border-color:#e674a0}.auth-card .btn{margin-top:6px;padding:14px}.auth-card .small{font-size:12px;color:#9d95a5}.auth-card .error{color:#bc4872;min-height:20px;font-size:12px}.auth-card .brand{font-size:23px}.auth-card .back{display:block;margin-top:24px;color:#85798b;font-size:12px;text-align:center}.passkey{margin-top:12px;background:#f8f4f9;padding:16px;border-radius:13px}.passkey p{margin:7px 0 12px}</style></head><body><div class="auth-card"><a class="brand" href="/"><span class="brand-icon">m<span>•</span></span><span>murdili<span class="brand-pink">max</span></span></a><h1 id="heading">Добро пожаловать!</h1><p id="hint">Войдите или создайте аккаунт по коду из письма.</p><form id="emailForm"><label for="email">Email</label><input id="email" type="email" autocomplete="username webauthn" required placeholder="you@example.com"><button class="btn btn-primary" type="submit">Получить код</button></form><form id="codeForm" hidden><label for="code">Код из письма</label><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="123456" required><button type="submit" class="btn btn-primary">Войти</button><button type="button" class="btn btn-text" id="retry">Изменить email</button></form><div class="error" id="error"></div><div id="passkey" class="passkey" hidden><strong>Вход без кода в следующий раз</strong><p>Сохраните ключ доступа и входите по отпечатку или Face ID.</p><button class="btn btn-dark" id="saveKey">Сохранить ключ</button><button class="btn btn-text" id="skipKey">Не сейчас</button></div><a href="/" class="back">← Вернуться в каталог</a><div class="small" style="text-align:center;margin-top:15px">Только 18+ · MurdiliMax</div></div><script>
const auth=window.hatchable?.auth;
const next=new URLSearchParams(location.search).get("next");
const back=next&&next.startsWith("/")&&!next.startsWith("//")?next:"/";
const error=document.getElementById("error");let hasPasskey=false;
function fail(e){error.textContent=e?.message||"Ошибка, попробуйте ещё раз"}
function go(){location.href=back}
document.getElementById("emailForm").onsubmit=async e=>{e.preventDefault();error.textContent="";let email=document.getElementById("email").value.trim();const btn=e.target.querySelector("button");btn.disabled=true;try{if(!auth)throw Error("Авторизация недоступна");let r=await auth.startLogin({email});hasPasskey=!!r.has_passkey;if(hasPasskey&&auth.supportsPasskeys()){try{const done=await auth.signInWithPasskey({email});if(done.user)return go()}catch(e){}}document.getElementById("emailForm").hidden=true;document.getElementById("codeForm").hidden=false;document.getElementById("hint").textContent="Отправили шестизначный код на "+email}catch(err){fail(err)}finally{btn.disabled=false}};
document.getElementById("codeForm").onsubmit=async e=>{e.preventDefault();error.textContent="";try{const r=await auth.verifyCode({email:document.getElementById("email").value.trim(),code:document.getElementById("code").value.trim()});if(!r?.user)throw Error("Не удалось войти");if(!hasPasskey&&auth.supportsPasskeys()&&localStorage.getItem("mm-passkey-skip")!=="1"){document.getElementById("codeForm").hidden=true;document.getElementById("passkey").hidden=false;document.getElementById("heading").textContent="Вы вошли!";return}go()}catch(err){fail(err)}};
document.getElementById("retry").onclick=()=>{document.getElementById("emailForm").hidden=false;document.getElementById("codeForm").hidden=true;error.textContent=""};
document.getElementById("saveKey").onclick=async()=>{try{await auth.registerPasskey({name:"MurdiliMax"});}catch{}go()};
document.getElementById("skipKey").onclick=()=>{localStorage.setItem("mm-passkey-skip","1");go()};
(async()=>{try{if((await auth?.getSession())?.user)go()}catch{}})();
</script></body></html>
