<script>
(()=>{"use strict";
const c=document.getElementById('scene'),x=c.getContext('2d'),fx=document.getElementById('fx'),f=fx.getContext('2d');
let W=innerWidth,H=innerHeight,d=devicePixelRatio||1,tf='1h',theme='night',mode='candle',showEMA=true,showRSI=false,showBB=false;
let data=[],price=0,lastPrice=0,rot=0,tilt=.12,zoom=1,drag=false,lx=0,ly=0,pinch=0,lastTap=0,anim=0,soundOn=true,audio=null;
const $=id=>document.getElementById(id);
function resize(){W=innerWidth;H=innerHeight;c.width=fx.width=W*d;c.height=fx.height=H*d;c.style.width=fx.style.width=W+'px';c.style.height=fx.style.height=H+'px';x.setTransform(d,0,0,d,0,0);f.setTransform(d,0,0,d,0,0);draw();particles()}
addEventListener('resize',resize);
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1600)}
function snd(freq=520,dur=.08){if(!soundOn)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.045,audio.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur+.02)}catch{}}
function setTheme(t){theme=t;document.body.classList.toggle('day',t==='day');$('day').classList.toggle('on',t==='day');$('night').classList.toggle('on',t==='night');draw();particles()}
$('day').onclick=()=>{setTheme('day');snd(650)};$('night').onclick=()=>{setTheme('night');snd(420)};
$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊':'🔇';if(soundOn)snd(620)};
$('full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{toast('Fullscreen недоступен')}}
function fmt(n){return Number(n).toLocaleString('en-US',{maximumFractionDigits:2})}
async function api(u){let a=new AbortController(),t=setTimeout(()=>a.abort(),8000);try{let r=await fetch('https://api.binance.com'+u,{cache:'no-store',signal:a.signal});if(!r.ok)throw Error(r.status);return r.json()}finally{clearTimeout(t)}}
async function load(){
 try{
  let [k,t]=await Promise.all([api('/api/v3/klines?symbol=BTCUSDT&interval='+tf+'&limit=90'),api('/api/v3/ticker/24hr?symbol=BTCUSDT')]);
  let old=data.length?data[data.length-1].c:0;
  data=k.map(a=>({t:a[0],o:+a[1],h:+a[2],l:+a[3],c:+a[4],v:+a[5]}));price=+t.lastPrice;
  $('price').textContent=fmt(price);$('chg').textContent=(+t.priceChangePercent>=0?'+':'')+fmt(t.priceChangePercent)+'%  24H';
  $('status').textContent='BINANCE • '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  signal();$('load').style.display='none';if(old&&Math.abs(price-old)/old>.0003)snd(price>old?760:260,.12);draw();
 }catch(e){$('status').textContent='RETRYING…';$('load').style.display='block';$('load').innerHTML='<div class="loader"></div>WAITING FOR MARKET';}
}
function ema(a,n){let k=2/(n+1),e=a[0],o=[e];for(let i=1;i<a.length;i++){e=a[i]*k+e*(1-k);o.push(e)}return o}
function rsi(a,n=14){let g=0,l=0;for(let i=1;i<=n;i++){let q=a[i]-a[i-1];g+=Math.max(0,q);l+=Math.max(0,-q)}g/=n;l/=n;let out=Array(n).fill(50),rs=l?g/l:99;out.push(100-100/(1+rs));for(let i=n+1;i<a.length;i++){let q=a[i]-a[i-1];g=(g*(n-1)+Math.max(0,q))/n;l=(l*(n-1)+Math.max(0,-q))/n;rs=l?g/l:99;out.push(100-100/(1+rs))}return out}
function signal(){if(data.length<25)return;let a=data.map(q=>q.c),e=ema(a,9),e2=ema(a,21),r=rsi(a),i=a.length-1,s=50;s+=e[i]>e2[i]?18:-18;s+=r[i]>55?12:r[i]<45?-12:0;s+=a[i]>a[i-3]?8:-8;s=Math.max(7,Math.min(93,Math.round(s)));let q=s>=62?'BUY':s<=38?'SELL':'NEUTRAL';$('sig').textContent=q;$('sig').style.color=q==='BUY'?'#32e9a4':q==='SELL'?'#ff5062':'#eef6ff';$('conf').textContent=s+'%';$('conf').style.color=q==='BUY'?'#32e9a4':q==='SELL'?'#ff5062':'#eef6ff';$('reason').textContent='· RSI '+r[i].toFixed(0)}
function P(px,py,pz=0){let cy=Math.cos(rot),sy=Math.sin(rot),ct=Math.cos(tilt),st=Math.sin(tilt),X=px*cy-pz*sy,Z=px*sy+pz*cy,Y=py*ct-Z*st;Z=py*st+Z*ct;let q=650*zoom/(650+Z);return[W/2+X*q,H*.58-Y*q,q]}
function bg(){
 let day=theme==='day',g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,day?'#bcd9ed':'#06172f');g.addColorStop(.5,day?'#77a7c8':'#061022');g.addColorStop(1,day?'#29475f':'#01040a');x.fillStyle=g;x.fillRect(0,0,W,H);
 let rg=x.createRadialGradient(W*.5,H*.55,20,W*.5,H*.55,Math.max(W,H)*.62);rg.addColorStop(0,day?'rgba(255,210,105,.2)':'rgba(30,130,255,.18)');rg.addColorStop(1,'transparent');x.fillStyle=rg;x.fillRect(0,0,W,H);
 // stars
 for(let i=0;i<75;i++){let xx=(i*97.31%W),yy=(i*53.17%H*.62),r=(i%3)*.35+.35;x.fillStyle=day?'rgba(255,255,255,.25)':'rgba(190,225,255,'+(i%5/12+.16)+')';x.beginPath();x.arc(xx,yy,r,0,Math.PI*2);x.fill()}
 // planet
 x.save();x.beginPath();x.ellipse(W*.5,H*.78,W*.74,H*.28,0,0,Math.PI*2);let pg=x.createRadialGradient(W*.5,H*.63,10,W*.5,H*.78,W*.7);pg.addColorStop(0,day?'rgba(225,243,255,.85)':'rgba(16,48,91,.9)');pg.addColorStop(1,day?'rgba(52,79,100,.8)':'rgba(2,8,18,.95)');x.fillStyle=pg;x.shadowBlur=day?25:50;x.shadowColor=day?'#fff':'#167cff';x.fill();x.restore();
 x.beginPath();x.ellipse(W*.5,H*.70,W*.75,H*.29,0,Math.PI,Math.PI*2);x.strokeStyle=day?'rgba(255,255,255,.6)':'rgba(54,177,255,.75)';x.lineWidth=3;x.shadowBlur=25;x.shadowColor=x.strokeStyle;x.stroke();x.shadowBlur=0;
}
function grid(){
 let day=theme==='day';x.save();for(let i=0;i<7;i++){let xx=-330+i*110,a=P(xx,155,-80),b=P(xx,-155,-80);x.strokeStyle=day?'rgba(22,70,100,.16)':'rgba(77,168,255,.13)';x.lineWidth=1;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()}for(let j=0;j<6;j++){let yy=145-j*58,a=P(-380,yy,-80),b=P(380,yy,-80);x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()}x.restore()}
function draw(){
 x.clearRect(0,0,W,H);bg();grid();if(!data.length){return}
 let arr=data.slice(-65),vals=arr.flatMap(q=>[q.h,q.l]),mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1,cx=-(arr.length-1)*10.5/2;
 if(mode==='line'){let e=arr.map(q=>q.c);x.beginPath();e.forEach((v,i)=>{let p=P(cx+i*10.5,145-(v-mn)/rg*250,0);i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])});x.strokeStyle='#3ed8ff';x.lineWidth=3;x.shadowBlur=16;x.shadowColor='#3ed8ff';x.stroke();x.shadowBlur=0}
 else arr.forEach((q,i)=>{let xx=cx+i*10.5,o=145-(q.o-mn)/rg*250,cc=145-(q.c-mn)/rg*250,hh=145-(q.h-mn)/rg*250,ll=145-(q.l-mn)/rg*250,pH=P(xx,hh),pL=P(xx,ll),pO=P(xx,o),pC=P(xx,cc),up=q.c>=q.o,col=up?'#24e5bd':'#ff4e82';x.strokeStyle=col;x.lineWidth=2;x.shadowBlur=9;x.shadowColor=col;x.beginPath();x.moveTo(pH[0],pH[1]);x.lineTo(pL[0],pL[1]);x.stroke();x.shadowBlur=0;let w=7,top=Math.min(pO[1],pC[1]),bh=Math.max(3,Math.abs(pC[1]-pO[1]));x.fillStyle=col;x.fillRect(pC[0]-w/2,top,w,bh);x.strokeStyle='rgba(255,255,255,.35)';x.strokeRect(pC[0]-w/2,top,w,bh);if(mode==='volume'){let vh=q.v/(Math.max(...arr.map(z=>z.v))||1)*50;x.globalAlpha=.3;x.fillRect(pC[0]-w/2,145-vh,w,vh);x.globalAlpha=1}});
 if(showEMA){let e=ema(arr.map(q=>q.c),9);x.beginPath();e.forEach((v,i)=>{let p=P(cx+i*10.5,145-(v-mn)/rg*250,1);i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])});x.strokeStyle='#ffd34e';x.lineWidth=2;x.stroke()}
 if(showBB){let a=arr.map(q=>q.c),n=20;x.strokeStyle='rgba(111,201,255,.7)';x.lineWidth=1;for(let sign of [-1,1]){x.beginPath();for(let i=n;i<a.length;i++){let s=a.slice(i-n,i),m=s.reduce((u,v)=>u+v,0)/n,sd=Math.sqrt(s.reduce((u,v)=>u+(v-m)**2,0)/n),v=m+sign*2*sd,p=P(cx+i*10.5,145-(v-mn)/rg*250,0);i===n?x.moveTo(p[0],p[1]):x.lineTo(p[0],p[1])}x.stroke()}}
 if(showRSI){let r=rsi(arr.map(q=>q.c)),y=H*.78;x.fillStyle='rgba(2,8,18,.62)';x.fillRect(25,y,W-50,43);x.strokeStyle='#d76cff';x.beginPath();r.forEach((v,i)=>{let xx=25+i*(W-50)/(r.length-1),yy=y+43-v*.43;i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke();x.fillStyle='#fff';x.font='800 9px system-ui';x.fillText('RSI 14  '+r[r.length-1].toFixed(1),33,y+13)}
 // floating BUY/SELL crosses
 if(arr.length>20){let a=arr.map(q=>q.c),e=ema(a,9),e2=ema(a,21);for(let i=1;i<arr.length;i++){let up=e[i]>e2[i]&&e[i-1]<=e2[i-1],dn=e[i]<e2[i]&&e[i-1]>=e2[i-1];if(up||dn){let yy=145-(arr[i].c-mn)/rg*250,p=P(cx+i*10.5,yy,2),col=up?'#32e9a4':'#ff5062';x.fillStyle=col;x.shadowBlur=15;x.shadowColor=col;x.beginPath();x.arc(p[0],p[1]+(up?17:-17),5,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.font='900 8px system-ui';x.fillText(up?'BUY':'SELL',p[0]-11,p[1]+(up?31:-27))}}}
}
let pts=[];function particles(){pts=Array.from({length:45},(_,i)=>({x:Math.random()*W,y:Math.random()*H*.65,s:.3+Math.random()*1.5,v:.15+Math.random()*.45,a:.15+Math.random()*.55}));}
function animate(){anim+=.016;f.clearRect(0,0,W,H);for(const p of pts){p.y-=p.v;if(p.y<0)p.y=H*.65;p.x+=Math.sin(anim+p.y*.01)*.08;f.globalAlpha=p.a;f.fillStyle=theme==='day'?'rgba(255,255,255,.65)':'rgba(72,183,255,.8)';f.beginPath();f.arc(p.x,p.y,p.s,0,Math.PI*2);f.fill()}f.globalAlpha=1;requestAnimationFrame(animate)}
c.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(!drag)return;rot+=(e.clientX-lx)*.006;tilt=Math.max(-.65,Math.min(.65,tilt+(e.clientY-ly)*.003));lx=e.clientX;ly=e.clientY;draw()});
c.addEventListener('pointerup',e=>{drag=false;let n=Date.now();if(n-lastTap<300){rot=0;tilt=.12;zoom=1;draw();toast('3D VIEW RESET');snd(600)}lastTap=n});
c.addEventListener('wheel',e=>{zoom*=e.deltaY>0?.92:1.08;zoom=Math.max(.65,Math.min(1.7,zoom));draw()},{passive:true});
let touch={};c.addEventListener('touchstart',e=>{for(let t of e.changedTouches)touch[t.identifier]={x:t.clientX,y:t.clientY};if(Object.keys(touch).length===2){let a=Object.values(touch);pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}},{passive:false});
c.addEventListener('touchmove',e=>{for(let t of e.changedTouches)if(touch[t.identifier])touch[t.identifier]={x:t.clientX,y:t.clientY};let a=Object.values(touch);if(a.length===2){let q=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);zoom*=q/pinch;zoom=Math.max(.65,Math.min(1.7,zoom));pinch=q;draw();e.preventDefault()}},{passive:false});
c.addEventListener('touchend',e=>{for(let t of e.changedTouches)delete touch[t.identifier]});
document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tf]').forEach(z=>z.classList.remove('on'));b.classList.add('on');tf=b.dataset.tf;snd(500);load()});
$('candle').onclick=()=>{mode='candle';setMode('candle')};$('line').onclick=()=>{mode='line';setMode('line')};$('volume').onclick=()=>{mode='volume';setMode('volume')};
function setMode(m){document.querySelectorAll('[id=candle],[id=line],[id=volume]').forEach(b=>b.classList.remove('on'));$(m).classList.add('on');draw();snd(580)}
$('ema').onclick=()=>{showEMA=!showEMA;$('ema').classList.toggle('on',showEMA);draw();snd(600)};
$('rsi').onclick=()=>{showRSI=!showRSI;$('rsi').classList.toggle('on',showRSI);draw();snd(640)};
$('bb').onclick=()=>{showBB=!showBB;$('bb').classList.toggle('on',showBB);draw();snd(680)};
$('nReset').onclick=()=>{rot=0;tilt=.12;zoom=1;draw();toast('3D VIEW RESET');snd(600)};
$('nSpace').onclick=()=>{rot+=.7;draw();toast('SPACE CAMERA');snd(720)};
$('nInd').onclick=()=>{$('ema').scrollIntoView({behavior:'smooth',inline:'center'});toast('INDICATORS');snd(560)};
$('nMore').onclick=()=>toast('DAY/NIGHT • SOUND • FULLSCREEN');
setTheme('night');resize();animate();load();setInterval(load,15000);
})();
</script>
