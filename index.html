<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>DOGIZEN 3D — BTC Terminal</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050b;color:#eaf3ff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;color:inherit;border:0}
#scene{position:fixed;inset:0}#hud{position:fixed;inset:0;pointer-events:none}.panel,.btn,.tab{background:rgba(3,10,20,.78);border:1px solid #17385b;border-radius:16px;box-shadow:0 8px 35px #0009, inset 0 0 18px #0b4b7a18;backdrop-filter:blur(12px)}
.top{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;gap:12px}.quote{width:310px;padding:12px 16px}.brand{font-weight:900;font-size:18px;letter-spacing:.5px}.sub{font-size:9px;color:#7592af;letter-spacing:2px}.price{font-size:30px;font-weight:950;margin-top:4px;color:#36f4a4;text-shadow:0 0 18px #00ff9955}.chg{font-size:12px;color:#36f4a4}.stats{padding:12px 15px;min-width:220px;font-size:11px;line-height:1.8;color:#7890aa}.stats b{color:#eaf3ff;float:right}.tabs{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:5px;white-space:nowrap}.tab{padding:9px 14px;border-radius:11px;background:#06101d99;color:#8fa9c2;cursor:pointer;pointer-events:auto}.tab.active{color:#fff;border-color:#25a7ff;box-shadow:0 0 18px #168dff55;background:#0d4f83}
.tf{position:absolute;top:112px;left:16px;padding:6px;display:flex;gap:5px}.tf button,.mode button{pointer-events:auto;padding:8px 12px;border-radius:10px;background:#06101d;border:1px solid #1b3958;color:#91a7bd}.tf button.active,.mode button.active{background:#0875c9;border-color:#4bc1ff;color:white;box-shadow:0 0 14px #008dff66}.mode{position:absolute;top:166px;left:16px;padding:5px;display:flex;gap:5px}.signal{position:absolute;right:16px;top:112px;width:235px;padding:13px}.signal .label{font-size:10px;color:#829bb3;letter-spacing:1px}.signal .sig{font-size:23px;font-weight:950;margin-top:3px}.BUY{color:#37f5a3;text-shadow:0 0 16px #00ff8855}.SELL{color:#ff526d;text-shadow:0 0 16px #ff305055}.NEUTRAL{color:#ffd166}.tools{position:absolute;left:16px;bottom:86px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}.btn{padding:11px 14px;cursor:pointer;background:rgba(4,13,24,.88);font-size:11px}.btn:hover{border-color:#2ba9ff}.bottom{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}.bottom .btn{min-width:110px}.status{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);font-size:10px;color:#35e7a0;white-space:nowrap}.hint{position:absolute;right:18px;bottom:20px;font-size:9px;color:#637c96;text-align:right}.selected{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);font-size:10px;color:#8ba6bf;display:none}.selected.show{display:block}
@media(max-width:700px){.top{top:9px;left:9px;right:9px}.quote{width:235px;padding:9px 11px}.brand{font-size:15px}.price{font-size:25px}.stats{display:none}.tabs{top:9px;right:9px;left:auto;transform:none}.tabs .tab:nth-child(n+4){display:none}.tab{padding:7px 9px}.tf{top:95px;left:9px;right:9px;overflow:auto}.mode{top:148px;left:9px}.signal{top:95px;right:9px;width:180px}.signal .sig{font-size:19px}.tools{left:9px;bottom:95px}.tools .btn{padding:9px 10px}.bottom{bottom:10px}.bottom .btn{min-width:88px;padding:9px}.status{bottom:63px}.hint{display:none}}
</style>
</head>
<body>
<div id="scene"></div>
<div id="hud">
  <div class="top">
    <div class="quote panel"><div class="brand">₿ BTC / USDT</div><div class="sub">DOGIZEN 3D CRYPTO TERMINAL</div><div id="price" class="price">—</div><div id="change" class="chg">—</div></div>
    <div class="stats panel"><div>24H HIGH <b id="hi">—</b></div><div>24H LOW <b id="lo">—</b></div><div>24H VOL <b id="vol">—</b></div><div>MODE <b id="live">CONNECTING</b></div></div>
  </div>
  <div class="tabs panel"><button class="tab active">BTC/USDT</button><button class="tab">ETH/USDT</button><button class="tab">SOL/USDT</button><button class="tab">BNB/USDT</button></div>
  <div class="tf panel"><button data-tf="1m">1m</button><button data-tf="5m">5m</button><button data-tf="15m">15m</button><button data-tf="1h" class="active">1H</button><button data-tf="4h">4H</button><button data-tf="1d">1D</button><button data-tf="1w">1W</button></div>
  <div class="mode panel"><button data-mode="candle" class="active">CANDLE</button><button data-mode="line">LINE</button><button data-mode="volume">VOLUME</button></div>
  <div class="signal panel"><div class="label">⚡ TECHNICAL SIGNAL</div><div id="sig" class="sig NEUTRAL">NEUTRAL</div><div id="reason" class="sub">EMA 9/21 · RSI · MACD · MOMENTUM</div></div>
  <div class="tools"><button class="btn" id="select">◉ SELECT</button><button class="btn" id="delete">▣ DELETE</button><button class="btn" id="zoom">⌕ ZOOM</button><button class="btn" id="rotate">◌ ROTATE</button><button class="btn" id="reset">↻ RESET</button></div>
  <div class="selected" id="selected">SELECTED CANDLE</div>
  <div class="status" id="status">● LIVE · BINANCE</div>
  <div class="bottom"><button class="btn" id="theme">☀ DAY</button><button class="btn" id="sound">🔊 SOUND OFF</button><button class="btn" id="demo">▶ DEMO</button><button class="btn" id="full">⛶ FULL</button></div>
  <div class="hint">ONE FINGER: ROTATE · TWO FINGERS: ZOOM · TAP CANDLE: SELECT · DELETE: REMOVE</div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const root=document.getElementById('scene');
let scene,camera,renderer,controls,raycaster,mouse;
let candleGroup=new THREE.Group(), volumeGroup=new THREE.Group(), lineGroup=new THREE.Group();
let candles=[], data=[], selected=null, tf='1h', mode='candle', dark=true, demo=false, soundOn=false, lastPrice=0;
const ui=id=>document.getElementById(id);
const colors={up:0x19f58e,down:0xff3f61,blue:0x21a8ff,orange:0xffa52b};

init(); seed(); renderData(); load();
setInterval(()=>demo?tickDemo():load(),15000);

function init(){
 scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x02050b,.0018);
 camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,5000); camera.position.set(70,48,110);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace; root.appendChild(renderer.domElement);
 controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.dampingFactor=.075; controls.minDistance=35; controls.maxDistance=230; controls.maxPolarAngle=Math.PI*.47; controls.target.set(0,8,0);
 raycaster=new THREE.Raycaster(); mouse=new THREE.Vector2();
 scene.add(new THREE.AmbientLight(0x6b8db0,.55)); let key=new THREE.PointLight(0x1d9cff,110,260);key.position.set(0,70,30);scene.add(key);let warm=new THREE.PointLight(0xff8b24,80,220);warm.position.set(-70,20,-50);scene.add(warm);
 scene.add(candleGroup,volumeGroup,lineGroup); addGrid(); addStars(); addSpaceRocks();
 renderer.domElement.addEventListener('pointerdown',pick); addEventListener('resize',resize);
 animate();
}
function addGrid(){let g=new THREE.GridHelper(150,30,0x154d73,0x10324e);g.position.y=-1;scene.add(g);let ring=new THREE.Mesh(new THREE.TorusGeometry(42,.22,8,96),new THREE.MeshBasicMaterial({color:0xffa42b}));ring.rotation.x=Math.PI/2;ring.position.y=-.7;scene.add(ring);}
function addStars(){let geo=new THREE.BufferGeometry(),arr=[];for(let i=0;i<1400;i++)arr.push((Math.random()-.5)*500,Math.random()*220-20,(Math.random()-.5)*500);geo.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));let m=new THREE.PointsMaterial({color:0x86bfff,size:.65,transparent:true,opacity:.75});scene.add(new THREE.Points(geo,m));}
function addSpaceRocks(){for(let i=0;i<7;i++){let p=new THREE.Mesh(new THREE.IcosahedronGeometry(7+Math.random()*10,1),new THREE.MeshStandardMaterial({color:0x071422,roughness:1,metalness:.2}));p.position.set((Math.random()-.5)*260,25+Math.random()*70,-130-Math.random()*100);scene.add(p)}}
function seed(){let p=78500;data=[];for(let i=0;i<42;i++){let o=p+(Math.random()-.5)*700, c=o+(Math.random()-.48)*1100,h=Math.max(o,c)+Math.random()*450,l=Math.min(o,c)-Math.random()*450;data.push({o,h,l,c,v:500+Math.random()*1800});p=c}}
function renderData(){clearGroups(); candles=[]; const max=Math.max(...data.map(d=>d.h)),min=Math.min(...data.map(d=>d.l)),range=max-min||1; const sx=3.25, base=-((data.length-1)*sx)/2;
 data.forEach((d,i)=>{let x=base+i*sx; let y=(d.c-(max+min)/2)/range*70; let h=Math.max(.9,Math.abs(d.c-d.o)/range*70), wick=Math.max(2,(d.h-d.l)/range*70); let up=d.c>=d.o, col=up?colors.up:colors.down;
  let mat=new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.55,metalness:.3,roughness:.25,transparent:true,opacity:.92}); let body=new THREE.Mesh(new THREE.BoxGeometry(1.9,h,1.9),mat); body.position.set(x,(d.o+d.c)/2?y:0,0); body.position.y=(d.o+d.c)/2-(max+min)/2; body.position.y=body.position.y/range*70; body.userData.index=i; body.userData.type='body';
  let wm=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.9});let wg=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,(d.l-(max+min)/2)/range*70,0),new THREE.Vector3(x,(d.h-(max+min)/2)/range*70,0)]);let wickObj=new THREE.Line(wg,wm);wickObj.userData.index=i;wickObj.userData.type='wick';
  candleGroup.add(body,wickObj);candles.push({body,wick:wickObj,index:i});
  let vh=d.v/Math.max(...data.map(q=>q.v))*12;let vm=new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.25,transparent:true,opacity:.45});let vb=new THREE.Mesh(new THREE.BoxGeometry(1.5,vh,1.5),vm);vb.position.set(x,-1+vh/2,0);volumeGroup.add(vb);
 });
 drawLine(max,min,range); applyMode(); updateUI();
}
function drawLine(max,min,range){lineGroup.clear();let sx=3.25,base=-((data.length-1)*sx)/2,g=new THREE.BufferGeometry(),pts=[];data.forEach((d,i)=>pts.push(new THREE.Vector3(base+i*sx,(d.c-(max+min)/2)/range*70,2)));g.setFromPoints(pts);lineGroup.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:colors.blue,transparent:true,opacity:.95})));}
function clearGroups(){[candleGroup,volumeGroup,lineGroup].forEach(g=>{while(g.children.length){let o=g.children.pop();o.geometry?.dispose();if(o.material)o.material.dispose()}})}
function applyMode(){candleGroup.visible=mode==='candle';volumeGroup.visible=mode==='volume';lineGroup.visible=mode==='line'||mode==='candle';}
function updateUI(){if(!data.length)return;let d=data[data.length-1];ui('price').textContent=d.c.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});let pct=lastPrice?((d.c-lastPrice)/lastPrice*100):0;ui('change').textContent=(pct>=0?'+':'')+pct.toFixed(2)+'%';ui('hi').textContent=Math.max(...data.map(q=>q.h)).toLocaleString();ui('lo').textContent=Math.min(...data.map(q=>q.l)).toLocaleString();ui('vol').textContent=Math.round(data.reduce((a,q)=>a+q.v,0)).toLocaleString()+' BTC';let s=signal();ui('sig').textContent=s;ui('sig').className='sig '+s;lastPrice=d.c}
function signal(){let a=data.map(d=>d.c),e9=ema(a.slice(-30),9),e21=ema(a.slice(-30),21),gain=0,loss=0;for(let i=Math.max(1,a.length-14);i<a.length;i++){let q=a[i]-a[i-1];if(q>0)gain+=q;else loss-=q}let r=100-100/(1+gain/(loss||.0001));return e9>e21&&r>52?'BUY':e9<e21&&r<48?'SELL':'NEUTRAL'}
function ema(a,n){let e=a[0],k=2/(n+1);for(let i=1;i<a.length;i++)e=a[i]*k+e*(1-k);return e}
async function load(){try{let r=await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval='+tf+'&limit=42',{cache:'no-store'});if(!r.ok)throw 0;let a=await r.json();data=a.map(q=>({o:+q[1],h:+q[2],l:+q[3],c:+q[4],v:+q[5]}));let t=await fetch('https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT',{cache:'no-store'}).then(r=>r.json());ui('hi').textContent=Number(t.highPrice).toLocaleString();ui('lo').textContent=Number(t.lowPrice).toLocaleString();ui('vol').textContent=Number(t.volume).toFixed(0)+' BTC';ui('live').textContent='LIVE';ui('status').textContent='● LIVE · BINANCE';renderData();}catch(e){ui('live').textContent='DEMO';ui('status').textContent='● DEMO · CONNECTION RETRY';if(!data.length){seed();renderData()}}}
function tickDemo(){if(!data.length)seed();let old=data.at(-1),o=old.c,c=o+(Math.random()-.47)*900;data.shift();data.push({o,h:Math.max(o,c)+Math.random()*350,l:Math.min(o,c)-Math.random()*350,c,v:500+Math.random()*1900});renderData();playCandleSound(data.at(-1),old)}
function pick(e){if(e.pointerType==='touch'&&e.isPrimary===false)return;mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(mouse,camera);let hits=raycaster.intersectObjects(candleGroup.children,false);if(!hits.length)return;let i=hits[0].object.userData.index;if(i==null)return;selected=i;ui('selected').textContent='SELECTED CANDLE #'+(i+1)+' · '+data[i].c.toLocaleString();ui('selected').classList.add('show');highlight(i);if(soundOn)beep(520+(i%7)*55,.06)}
function highlight(i){candles.forEach((c,n)=>{c.body.material.emissiveIntensity=n===i?1.8:.55;c.body.scale.setScalar(n===i?1.14:1)})}
function deleteSelected(){if(selected==null)return;data.splice(selected,1);selected=null;ui('selected').classList.remove('show');renderData();beep(180,.09)}
function beep(freq,dur=.1){if(!soundOn)return;let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;let ac=new AC(),o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.055,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur+.02)}
function playCandleSound(n,o){if(!soundOn)return;let delta=n.c-o.c,mag=Math.min(1,Math.abs(delta)/900);let freq=delta>=0?560+mag*420:300-mag*130;beep(freq,.07+mag*.12);setTimeout(()=>beep(delta>=0?820:220,.045),70)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}

document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tf]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tf=b.dataset.tf;load()});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;applyMode()});
ui('delete').onclick=deleteSelected;ui('select').onclick=()=>ui('status').textContent='● SELECT MODE · TAP A CANDLE';ui('zoom').onclick=()=>{camera.position.multiplyScalar(.72);controls.update()};ui('rotate').onclick=()=>{controls.autoRotate=!controls.autoRotate;controls.autoRotateSpeed=1.4};ui('reset').onclick=()=>{camera.position.set(70,48,110);controls.target.set(0,8,0);controls.update();highlight(-1)};
ui('sound').onclick=()=>{soundOn=!soundOn;ui('sound').textContent=soundOn?'🔊 SOUND ON':'🔊 SOUND OFF';if(soundOn)beep(700,.12)};
ui('demo').onclick=()=>{demo=!demo;ui('demo').textContent=demo?'■ DEMO':'▶ DEMO';if(demo)ui('status').textContent='● DEMO · LIVE CANDLE SOUNDS'};
ui('theme').onclick=()=>{dark=!dark;scene.fog.color.set(dark?0x02050b:0xbfd4e8);renderer.setClearColor(dark?0x02050b:0xbfd4e8);ui('theme').textContent=dark?'☀ DAY':'◐ NIGHT'};
ui('full').onclick=()=>document.documentElement.requestFullscreen?.();
</script>
</body></html>
