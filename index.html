<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/examples/js/controls/OrbitControls.js"></script><script>
(()=>{const c=document.getElementById('scene'),$=id=>document.getElementById(id);let scene,camera,renderer,controls,g,gg,cg,vg,lg,gl,data=[],tf='1h',mode='candle',dark=true,showGrid=true,demo=false,soundOn=false,ready=false;
function init(){if(typeof THREE==='undefined'){seed();$('loading').textContent='Не загрузился WebGL';return}scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x02050c,.012);camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,3000);camera.position.set(0,38,88);renderer=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;scene.add(new THREE.AmbientLight(0x9bc5ff,.75));let k=new THREE.DirectionalLight(0xffffff,2.2);k.position.set(25,60,35);scene.add(k);let a=new THREE.PointLight(0x2e8cff,35,160);a.position.set(-40,25,30);scene.add(a);let b=new THREE.PointLight(0x8b3dff,22,150);b.position.set(45,10,-20);scene.add(b);let st=new THREE.BufferGeometry(),p=[];for(let i=0;i<1000;i++)p.push((Math.random()-.5)*260,Math.random()*130-15,(Math.random()-.5)*220-40);st.setAttribute('position',new THREE.Float32BufferAttribute(p,3));scene.add(new THREE.Points(st,new THREE.PointsMaterial({color:0x7fb5ff,size:.55,transparent:true,opacity:.7})));g=new THREE.Group();scene.add(g);gg=new THREE.Group();cg=new THREE.Group();vg=new THREE.Group();lg=new THREE.Group();gl=new THREE.Group();g.add(gg,cg,vg,lg,gl);let pl=new THREE.Mesh(new THREE.PlaneGeometry(170,90),new THREE.MeshBasicMaterial({color:0x06101d,transparent:true,opacity:.34,side:THREE.DoubleSide}));pl.rotation.x=-Math.PI/2;pl.position.y=-15;scene.add(pl);controls=new THREE.OrbitControls(camera,c);controls.enableDamping=true;controls.dampingFactor=.055;controls.enablePan=false;controls.minDistance=38;controls.maxDistance=150;controls.minPolarAngle=.65;controls.maxPolarAngle=1.48;controls.target.set(0,4,0);addEventListener('resize',resize);c.addEventListener('dblclick',reset);ready=true;animate()}
function resize(){if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}function clear(q){while(q.children.length){let o=q.children.pop();o.geometry?.dispose();o.material?.dispose()}}function seed(){data=[];let p=104500;for(let i=0;i<90;i++){let o=p+(Math.random()-.5)*800,x=o+(Math.random()-.45)*1500,h=Math.max(o,x)+Math.random()*500,l=Math.min(o,x)-Math.random()*500;data.push({o,h,l,c:x,v:300+Math.random()*900});p=x}if(ready)render();$('loading').classList.add('hide')}
function grid(){clear(gg);if(!showGrid)return;let m=new THREE.LineBasicMaterial({color:dark?0x285078:0x7189a5,transparent:true,opacity:.55});for(let j=0;j<7;j++){let y=-10+j*22/6;gg.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-70,y,0),new THREE.Vector3(70,y,0)]),m.clone()))}for(let i=0;i<10;i++){let x=-70+i*140/9;gg.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,-10,0),new THREE.Vector3(x,12,0)]),m.clone()))}}
function render(){if(!ready||!data.length)return;clear(cg);clear(vg);clear(lg);clear(gl);grid();let max=Math.max(...data.map(d=>d.h)),min=Math.min(...data.map(d=>d.l)),r=Math.max(1,max-min),step=140/(data.length-1),pts=[];data.forEach((d,i)=>{let x=-70+i*step,y=-10+(d.c-min)/r*22,up=d.c>=d.o,col=up?0x22e6a0:0xff5570,hy=-10+(d.h-min)/r*22,ly=-10+(d.l-min)/r*22,oy=-10+(d.o-min)/r*22;pts.push(new THREE.Vector3(x,y,0));if(mode!=='line'){let w=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,Math.max(.3,hy-ly),6),new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.55,roughness:.4}));w.position.set(x,(hy+ly)/2,0);cg.add(w);let body=new THREE.Mesh(new THREE.BoxGeometry(1.55,Math.max(.35,Math.abs(y-oy)),2.2),new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.35,metalness:.15,roughness:.32}));body.position.set(x,(y+oy)/2,0);cg.add(body);let halo=new THREE.Mesh(new THREE.BoxGeometry(2.2,Math.max(.5,Math.abs(y-oy)+.5),2.8),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.045,blending:THREE.AdditiveBlending}));halo.position.copy(body.position);gl.add(halo)}if(mode==='volume'){let vh=d.v/Math.max(...data.map(q=>q.v))*8;let vm=new THREE.Mesh(new THREE.BoxGeometry(1.5,vh,1.8),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.34}));vm.position.set(x,-12+vh/2,-2);vg.add(vm)}});if(mode==='line'){let geo=new THREE.BufferGeometry().setFromPoints(pts);lg.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color:0x53a6ff})));}let last=data.at(-1),y=-10+(last.c-min)/r,s=signal();let mark=new THREE.Mesh(new THREE.SphereGeometry(.72,16,16),new THREE.MeshStandardMaterial({color:s==='BUY'?0x22e6a0:s==='SELL'?0xff5570:0xffd166,emissive:s==='BUY'?0x22e6a0:s==='SELL'?0xff5570:0xffd166,emissiveIntensity:3}));mark.position.set(70,y,3);gl.add(mark);update()}
function ema(a,n){let k=2/(n+1),e=a[0];for(let i=1;i<a.length;i++)e=a[i]*k+e*(1-k);return e}function signal(){let a=data.map(d=>d.c);if(a.length<22)return'NEUTRAL';let e9=ema(a.slice(-40),9),e21=ema(a.slice(-40),21),up=0,down=0;for(let i=Math.max(1,a.length-14);i<a.length;i++){let q=a[i]-a[i-1];q>0?up+=q:down-=q}let rsi=100-100/(1+up/(down||.0001));return e9>e21&&rsi>52?'BUY':e9<e21&&rsi<48?'SELL':'NEUTRAL'}function update(){let d=data.at(-1);if(!d)return;let pct=(d.c/(data[0]?.c||d.c)-1)*100;$('price').textContent=d.c.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});$('change').textContent=(pct>=0?'▲ +':'▼ ')+pct.toFixed(2)+'% SESSION';$('change').style.color=pct>=0?'#22e6a0':'#ff5570';$('hi').textContent=Math.max(...data.map(q=>q.h)).toLocaleString();$('lo').textContent=Math.min(...data.map(q=>q.l)).toLocaleString();$('vol').textContent=Math.round(data.reduce((a,q)=>a+q.v,0))+' BTC';let s=signal(),e=$('sig');e.textContent=s;e.className='sig '+(s==='BUY'?'buy':s==='SELL'?'sell':'neutral')}
async function load(){try{$('status').textContent='● CONNECTING TO BINANCE';let r=await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval='+tf+'&limit=90',{cache:'no-store'});if(!r.ok)throw 0;let a=await r.json();data=a.map(q=>({o:+q[1],h:+q[2],l:+q[3],c:+q[4],v:+q[5]}));let t=await fetch('https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT',{cache:'no-store'}).then(r=>r.json());$('hi').textContent=Number(t.highPrice).toLocaleString();$('lo').textContent=Number(t.lowPrice).toLocaleString();$('vol').textContent=Number(t.volume).toFixed(1)+' BTC';$('status').textContent='● LIVE · BINANCE · '+tf.toUpperCase();$('loading').classList.add('hide');render()}catch(e){if(!data.length)seed();$('status').textContent='● DEMO FALLBACK · BINANCE UNAVAILABLE'}}function beep(f=520){if(!soundOn)return;let A=window.AudioContext||window.webkitAudioContext;if(!A)return;let ac=new A(),o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f;v.gain.value=.035;o.connect(v);v.connect(ac.destination);o.start();v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.15);o.stop(ac.currentTime+.16)}function reset(){if(!controls)return;camera.position.set(0,38,88);controls.target.set(0,4,0);controls.update()}
function animate(){requestAnimationFrame(animate);controls.update();g.rotation.y+=.00035;gl.rotation.y-=.0002;renderer.render(scene,camera)}function tick(){if(!demo||!data.length)return;let d=data.at(-1),o=d.c,x=o+(Math.random()-.44)*850;data.push({o,h:Math.max(o,x)+Math.random()*420,l:Math.min(o,x)-Math.random()*420,c:x,v:350+Math.random()*900});data.shift();beep(x>=o?680:300);render()}
document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tf]').forEach(q=>q.classList.remove('active'));b.classList.add('active');tf=b.dataset.tf;load()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(q=>q.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;render()});$('grid').onclick=()=>{showGrid=!showGrid;render()};$('reset').onclick=reset;$('full').onclick=()=>document.documentElement.requestFullscreen?.();$('theme').onclick=()=>{dark=!dark;$('theme').textContent=dark?'☀ DAY':'◐ NIGHT';if(scene)scene.fog.color.set(dark?0x02050c:0xdfe9f2);render()};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 SOUND ON':'🔇 SOUND';beep(720)};$('demo').onclick=()=>{demo=!demo;$('demo').textContent=demo?'■ DEMO':'▶ DEMO';$('status').textContent=demo?'● LIVE DEMO · ANIMATED MARKET':'● LIVE · BINANCE'};init();seed();load();setInterval(()=>demo?tick():load(),15000)})();
